l_spanish:
 vs_adders_fang_name: "Colmillo de víbora" #NT!
 vs_adders_fang_description: "El Colmillo de Víbora es la espada ancestral que portaba el líder de la Casa Wyl. La ornamentada espada bastarda con su distintiva hoja ondulada fue empuñada por el infame Wyl de Wyl durante la primera Guerra Dorniense." #NT!
 vs_blackfyre_name: "Fuegoscuro" #NT!
 vs_blackfyre_description: "Fuegoscuro fue una de las dos espadas de acero valyrio que los Targaryen trajeron a Poniente desde Valyria antes de la Maldición, lo que la convierte en una de las posesiones más preciadas de la familia Targaryen. Es una gran espada enorme y ornamentada, con cabezas de dragón de acero ennegrecido que decoran los gavilanes." #NT!
 vs_brightroar_name: "Rugido brillante" #NT!
 vs_brightroar_description: "Brightroar es la gran espada de acero valyrio ancestral de la Casa Lannister, perdida con Tommen II tras la Maldición de Valyria." #NT!
 vs_cloudbreak_name: "Nubes rompientes" #NT!
 vs_cloudbreak_description: "Un arma elegante de una era más civilizada. Esta espada larga con empuñadura de hueso de dragón, que captura el alma de la elegante belleza perdida de Valyria, está coronada por un trozo de piedra de sangre pulida y brillante como pomo. Desde que la Perdición se llevó al jinete de dragón que empuñaba la espada, Cloudbreak ha estado al cuidado de los ricos comerciantes Tyroshi de la Casa Adarys, un claro símbolo de su ascendencia." #NT!
 vs_iron_will_name: "Voluntad de hierro" #NT!
 vs_iron_will_description: "La Voluntad de hierro es la gran espada de acero valyrio que se ha transmitido de generación en generación entre los Señores de la Casa Forrester. Es increíblemente valiosa y codiciada." #NT!
 vs_pincer_name: "Pinza" #NT!
 vs_pincer_description: "Pincer es el hacha de acero valyrio que pertenece a la Casa Celtigar. Una reliquia de hoja oscura de su legado valyrio, Pincer ha sido usada por generaciones de Celtigars desde antes de la Maldición." #NT!
 vs_dark_sister_name: "Hermana oscura" #NT!
 vs_dark_sister_description: "La Hermana Oscura fue una de las dos espadas de acero valyrio que los Targaryen trajeron de Rocadragón después de la Maldición, lo que la convirtió en una de las posesiones más preciadas de la familia Targaryen. Es una espada larga, delgada y elegante con una hoja de color humo oscuro." #NT!
 vs_heartsbane_name: "Corazones muertos" #NT!
 vs_heartsbane_description: "Heartsbane es la espada ancestral de acero valyrio de la Casa Tarly. Es una espada de dos manos que ha estado en posesión de estos orgullosos señores de las Marcas desde 300 años antes de la conquista." #NT!
 vs_ice_name: "Hielo" #NT!
 vs_ice_description: "Ice es la espada ancestral de acero valyrio de la Casa Stark, forjada en Valyria más de un siglo antes de la conquista de Aegon. Los Stark han tenido una espada llamada Ice desde la Era de los Héroes, esta espada recibió ese nombre para continuar la tradición." #NT!
 vs_oathkeeper_name: "Guardián del juramento" #NT!
 vs_oathkeeper_description: "Oathkeeper es una nueva espada larga de acero valyrio forjada a partir de la antigua espada Ice por orden de Tywin Lannister. Tiene ondulaciones rojas y negras a lo largo de su afilada hoja." #NT!
 vs_widows_wail_name: "Lamento de la viuda" #NT!
 vs_widows_wail_description: "Esta espada de acero valyrio tiene un color único con ondas de color rojo oscuro y gris en toda la hoja. Viene acompañada de una vaina decorada con oro, madera de cerezo, cuero rojo y cabezas de león doradas con ojos de rubí." #NT!
 vs_widows_wail_historical_description: "Widow's Wail es una nueva espada de acero valyrio forjada a partir de la antigua espada Ice por orden de Tywin Lannister. Tiene ondulaciones rojas y negras en el acero y su vaina está decorada llamativamente con oro, madera de cerezo, cuero rojo y cabezas de león doradas con ojos de rubí." #NT!
 vs_lady_forlorn_name: "Dama desamparada" #NT!
 vs_lady_forlorn_description: "Lady Forlorn es la espada larga de acero valyrio que pertenece a la Casa Corbray. Tiene un rubí en forma de corazón en el pomo." #NT!
 vs_lamentation_name: "Lamentación" #NT!
 vs_lamentation_description: "Lamentación es la espada de acero valyrio de la Casa Royce, una antigua y poderosa casa noble del Valle. Es anterior al gobierno de los Arryn en el Valle, y su sangre se remonta a los días de los Primeros Hombres que una vez poblaron el Valle y su gobierno como los Reyes de Bronce de Piedra Rúnica, hasta la conquista ándala en la que fueron derrotados por Artys Arryn, el Rey de la Montaña y el Valle." #NT!
 vs_longclaw_name: "Garra larga" #NT!
 vs_longclaw_description: "Longclaw es la espada bastarda de acero valyrio ancestral de la Casa Mormont, que ha estado en manos de su dinastía durante cientos de años. Esta espada es más larga que la mayoría, afilada para cortar y cortar. Tres ranuras recorren la mitad de la hoja oscura, mejorando el equilibrio ya sublime." #NT!
 vs_nightfall_name: "Anochecer" #NT!
 vs_nightfall_description: "Nightfall es una espada de acero valyrio que perteneció a la Casa Harlaw hacia finales del siglo III d.C. La espada larga de hoja oscura se pagó con el precio del hierro, confiscada a un corsario asesinado por Lord Dalton Greyjoy. Tiene un pomo de piedra lunar." #NT!
 vs_orphan_maker_name: "Creador de huérfanos" #NT!
 vs_orphan_maker_description: "Orphan-Maker es la espada de acero valyrio, originalmente propiedad de la casa Roxton, que fue utilizada por varios caballeros que lucharon por los Verdes en la Danza de los Dragones. La estructura de acero azul oscuro está tallada en forma de púas amenazantes, lo que le da un aura macabra a esta temible arma." #NT!
 vs_poison_name: "Veneno" #NT!
 vs_poison_description: "Poison es la espada de acero valyrio de la Casa Vunatis, una espada bastarda de acero valyrio que originalmente estaba destinada a ser intercambiada por bolsas de oro con los Volantenes al otro lado del Mar Angosto, antes de que el barco en el que viajaba fuera capturado por los Señores Piratas de Bloodstone. La empuñadura está hecha de hueso de dragón, tallado en forma de sacacorchos." #NT!
 vs_red_rain_name: "Lluvia roja" #NT!
 vs_red_rain_description: "Red Rain es una espada larga de color sangre, con rubíes en forma de lágrima incrustados. Pertenece a la Casa Drumm desde que Hilmar el Astuto le arrebató la espada a un caballero con armadura, con solo su ingenio y un garrote de madera." #NT!
 vs_remige_name: "Remige" #NT!
 vs_remige_description: "Remige es la espada ancestral de acero valyrio de la Casa Cargyll, sostenida en manos del legendario Ganso Dorado que fue el primero en traer huevos a Poniente." #NT!
  
 vs_strangers_mercy_name: "Misericordia del extraño" #NT!
 vs_strangers_mercy_description: "Stranger's Mercy es una espada bastarda de acero valyrio, cuyo pomo está engastado con un trozo de vidriagón pulido." #NT!
 vs_truth_name: "Verdad" #NT!
 vs_truth_description: "La verdad es la espada de acero valyrio de la Casa Rogare, una familia noble de antiguo linaje de Lys. La empuñadura dorada está elaboradamente tallada, lo que hace alusión a la obscena riqueza que la familia acumuló durante siglos en la profesión bancaria." #NT!
 vs_vigilance_name: "Vigilancia" #NT!
 vs_vigilance_description: "Vigilancia es la espada ancestral de acero valyrio de la Casa Hightower. Una espada larga, delgada y afilada, decorada con llamas doradas y almenas en referencia a su torre alta con faros en el corazón de Antigua." #NT!
 vs_widestripe_name: "Raya ancha" #NT!
 vs_widestripe_description: "La espada ancha de acero valyrio es la ancestral espada larga de la Casa Lydden, que llegó a Poniente en manos del futuro rey Joffrey Lydden. La espada ancha y oscura ha sido utilizada en muchas batallas por caballeros y señores con cresta de tejón." #NT!
 vs_longclaw_stark_name: "Garra larga" #NT!
 vs_longclaw_stark_description: "Longclaw es la espada bastarda de acero valyrio ancestral de la Casa Mormont, que ha estado en manos de su dinastía durante cientos de años. Esta espada es más larga que la mayoría, afilada para cortar y cortar. Tres ranuras recorren la mitad de la hoja oscura, mejorando el equilibrio ya sublime. El pomo original con forma de cabeza de oso fue reemplazado por una cabeza de lobo huargo de piedra pálida cuando la espada fue regalada a Jon Snow." #NT!
  
 vs_dancer_name: "Bailarín" #NT!
 vs_dancer_description: "Esta espada bastarda de hoja ancha fue empuñada por el último de los reyes Massey, que reclamaron y defendieron tierras que se extendían desde las costas orientales de Massey's Hook hasta la desembocadura del río Blackwater Rush. La empuñadura dorada está tallada con patrones antiguos, posiblemente inspirados en un arma anterior de la Era de los Héroes." #NT!
 vs_darktalon_name: "Garra oscura" #NT!
 vs_darktalon_description: "Los Vyrwels de Wyvern's Rest han blandido esta gran espada durante generaciones. La empuñadura plateada tiene tallada una feroz serpiente de cascabel con las alas abiertas." #NT!
 vs_dawn_name: "Amanecer" #NT!
 vs_dawn_description: "Dawn es la legendaria espada de la Casa Dayne. Esta enorme espada tiene una hoja pálida como el vidrio lechoso y una estrella dorada que decora la empuñadura. Las leyendas afirman que el fundador de la Casa Dayne siguió el rastro de una estrella caída hasta la desembocadura del Torrentine, en el lugar que más tarde se llamaría Starfall. Dawn se forjó a partir del corazón de esta estrella y, desde entonces, ha sido empuñada por los miembros más dignos de la Casa Dayne." #NT!
 vs_defiance_name: "Desafío" #NT!
 vs_defiance_description: "Defiance es una espada larga con empuñadura de bronce propiedad de la Casa Ironsmith. La Casa Ironsmith alcanzó prominencia durante siglos al proporcionar herraduras para la caballería del Norte. Con el tiempo, esta prominencia les permitió encargar Defiance y consolidar su estatus entre la nobleza del Norte." #NT!
 vs_disputant_name: "Disputante" #NT!
 vs_disputant_description: "Disputant es una espada de hoja corta con empuñadura de color dorado oscuro en forma de murciélago. La hoja es tan negra como la noche." #NT!
 vs_the_dagger_name: "Daga con empuñadura de hueso de dragón" #NT!
 vs_the_dagger_description: "Esta daga está incrustada con rubíes a lo largo de la empuñadura curvada de hueso de dragón. La inusual forma semicurvada y el uso de hueso de dragón en la empuñadura de esta malvada daga muestran que fue forjada en la antigua Valyria para una familia noble de extrema riqueza." #NT!
 vs_dusk_name: "Oscuridad" #NT!
 vs_dusk_description: "descripción del agot_dusk" #NT!
 vs_eleneis_bulwark_name: "El baluarte de Elenei" #NT!
 vs_eleneis_bulwark_description: "agot_eleneis_bulwark_description" #NT!
 vs_justicar_name: "Justicario" #NT!
 vs_justicar_description: "descripción del agot_justicar" #NT!
 vs_pride_name: "Orgullo" #NT!
 vs_pride_description: "Los caballeros con cresta de león de la Casa Jast han llevado esta espada larga desde los días del Reino de la Roca." #NT!
 vs_prosperity_name: "Prosperidad" #NT!
 vs_prosperity_description: "Esta espada dorada adornada es propiedad de la Casa Narratys, una familia noble de gran pedigrí entre la aristocracia Pentoshi. Varios príncipes de Pentos provienen de esta dinastía, lo que les permitió amasar la riqueza necesaria para comprar este símbolo de su propia prosperidad." #NT!
 vs_seafoam_name: "Espuma de mar" #NT!
 vs_seafoam_description: "El sable de acero valyrio de la Casa Velaryon está decorado con su símbolo, el Caballito de Mar. Esta espada curva con empuñadura de plata bellamente tallada se adquirió con las ganancias de generaciones de comercio." #NT!
 vs_skullcleaver_name: "Cuchilla de cráneo" #NT!
 vs_skullcleaver_description: "Los señores de Banefort han blandido esta inmensa espada durante generaciones. La espada recibió este nombre en honor a un capitán de los Hijos del Hierro que fue asesinado en combate singular por el señor de la Casa Banefort, con un golpe que atravesó el hacha, el casco y el cráneo del asaltante." #NT!
 vs_soaring_glory_name: "Gloria en alza" #NT!
 vs_soaring_glory_description: "descripción de agot_soaring_glory" #NT!
 vs_stalwart_name: "Leal" #NT!
 vs_stalwart_description: "Esta espada larga, afilada y letal con su metal dorado grabado es digna de admirar y ha demostrado ser letal en combate a lo largo de las generaciones que los Darklyns la han llevado a la batalla. Reyes, señores y caballeros de la Casa Darklyn han blandido esta espada contra muchos adversarios y en defensa de más reyes que cualquier otra casa." #NT!
 vs_sting_name: "Picadura" #NT!
 vs_sting_description: "Sting es la espada corta de acero valyrio ancestral de la Casa Beesbury. Esta oscura espada con hoja de hoja ha sido una fiel compañera para muchos de los miembros de esa antigua casa." #NT!
 vs_supremacy_name: "Supremacía" #NT!
 vs_supremacy_description: "Los Serretts de Silverhill son una orgullosa casa Ándala que compró esta ostentosa espada con plata extraída de las tierras que rodean su fortaleza." #NT!
 vs_swordfish_name: "Pez espada" #NT!
 vs_swordfish_description: "Los Bar Emmons de Sharp Point fueron fundados por Togarion el Terrible, un señor de la guerra ándalo que se labró un pequeño reino para él y sus descendientes a punta de espada. Esta espada bastarda con empuñadura de oro y plata fue utilizada por los Bar Emmons posteriores para mantener el control sobre este reino y es su posesión más preciada; incluso han bautizado el buque insignia de su flota con el nombre de la espada." #NT!
 vs_yron_key_name: "La llave de Yron" #NT!
 vs_yron_key_description: "descripción de la clave agot_yron" #NT!
 vs_tranquility_name: "Tranquilidad" #NT!
 vs_tranquility_description: "Esta espada larga plateada está incrustada con amatistas. La Casa Brax posee esta impresionante espada de acero valyrio desde hace cientos de años." #NT!
 vs_wyrmfang_name: "Colmillo de dragón" #NT!
 vs_wyrmfang_description: "Los Dustin de Barrowton son una antigua casa con una historia orgullosa y legendaria. Esta espada fue forjada a semejanza de las espadas de bronce que llevaban los antiguos reyes Dustin en la Era de los Héroes." #NT!
 vs_evergold_name: "Oro eterno" #NT!
 vs_evergold_description: "Encargada por la ilustre Casa Rowan antes de la Perdición, esta espada es de la más fina artesanía valyria. En su pomo se encuentra el estandarte dorado del árbol de la Casa Rowan." #NT!
  
 vs_black_death_name: "peste negra" #NT!
 vs_black_death_description: "Esta gran espada ha sido forjada exclusivamente para su eficacia en el campo de batalla. Su guarda está afilada con púas, su empuñadura está hecha de hierro negro quebradizo y su pomo está fabricado con una maza de hierro con púas diseñada para aplastar los cráneos de quienes se atrevan a acercarse." #NT!
 vs_mothers_grief_name: "El dolor de una madre" #NT!
 vs_mothers_grief_description: "El pomo de esta espada larga se ha modelado en forma de estatua de cobre de la Madre de Dios, tal vez como una súplica a los dioses para que concedan protección a los seres queridos en la batalla. La guarda grabada y la empuñadura están hechas del mismo cobre rojo." #NT!
 vs_talon_name: "Garra" #NT!
 vs_talon_description: "La guarda de esta espada larga tiene forma de alas y un gran zafiro azul en el centro. Su pomo, elaborado con el mismo acero teñido de azul, representa la cabeza de un halcón con vetas doradas que fluyen desde abajo y dos zafiros más pequeños en lugar de ojos." #NT!
 vs_glory_name: "Gloria" #NT!
 vs_glory_description: "Un rubí rojo intenso, tallado en forma de corazón, sirve como pomo para esta espada corta. El oro macizo, dispuesto en forma de llamas que lamen, abraza al rubí por cada lado en el abrazo ardiente de R'hllor." #NT!
 vs_stormy_nights_name: "Noches tormentosas" #NT!
 vs_stormy_nights_description: "Esta espada, de aspecto violento y áspero, carece de las ostentosas decoraciones que tienen la mayoría de los artefactos valyrios y conserva el tono oscuro con el que nació en la forja, retorcida y moldeada por su creador hasta darle una forma práctica. La falta de adornos le da a esta arma un aura brutal y severa en oposición a la mayoría de las creaciones del antiguo imperio: es un arma de guerrero, no el adorno de un noble." #NT!
 vs_strangers_touch_name: "El toque del extraño" #NT!
 vs_strangers_touch_description: "Aquellos que se encuentran bajo la sombra de este gigante deben encontrar consuelo al saber que han sido condenados por alguien que pensó que su final valía el mayor gasto." #NT!
 vs_dragonbane_name: "Matadragones" #NT!
 vs_dragonbane_description: "La empuñadura de esta espada está hecha de plata teñida de azul oscuro. Su pomo está elaborado con el mismo metal y tiene grabados intrincados. La guarda de la espada larga tiene la forma de un par de dragones con las alas extendidas a ambos lados de la hoja." #NT!
 vs_andal_armingsword_gold_name: "Espada larga de ándalo dorado" #NT!
 vs_andal_armingsword_gold_description: "El metal de esta espada larga brilla con un brillo dorado. La fina filigrana reluce a la luz de las velas, tan detallada como el patrón en espiral de la oscura hoja ondulada de acero valyrio. Esta espada parece adecuada para el mismísimo guerrero, un arma heroica que recuerda a una época pasada." #NT!
 vs_andal_armingsword_silver_name: "Espada larga de plata ándalo" #NT!
 vs_andal_armingsword_silver_description: "La ornamentada metalistería plateada de esta espada larga está bellamente grabada. La fina filigrana brilla a la luz de las velas, tan detallada como el patrón en espiral de la fina hoja ondulada de acero valyrio. Esta espada parece adecuada para el mismísimo guerrero, un arma heroica que recuerda a una época pasada." #NT!
 vs_andal_longsword_gold_name: "Espada bastarda de Andal dorado" #NT!
 vs_andal_longsword_gold_description: "El metal de esta espada bastarda brilla con un brillo dorado. La fina filigrana reluce a la luz de las velas, tan detallada como el patrón en espiral de la fina hoja ondulada de acero valyrio. Esta espada parece adecuada para el mismísimo guerrero, un arma heroica que recuerda a una época pasada." #NT!
 vs_andal_longsword_silver_name: "Espada bastarda de plata ándalo" #NT!
 vs_andal_longsword_silver_description: "La ornamentada metalistería plateada de esta espada bastarda está bellamente grabada. La fina filigrana brilla a la luz de las velas, tan detallada como el patrón en espiral de la fina hoja ondulada de acero valyrio. Esta espada parece adecuada para el mismísimo guerrero, un arma heroica que recuerda a una época pasada." #NT!
 vs_firstman_armingsword_gold_name: "Espada larga del primer hombre dorado" #NT!
 vs_firstman_armingsword_gold_description: "El metal de esta espada larga brilla con un brillo dorado. Las inscripciones rúnicas, escritas en la antigua lengua, brillan a la luz de las velas, tan detalladas como el patrón en espiral de la oscura y ondulada hoja de acero valyrio. El estilo y las proporciones de esta espada recuerdan mucho a las espadas que portaban los antiguos héroes de muchas casas del norte que afirmaban descender de los Primeros Hombres." #NT!
 vs_firstman_armingsword_silver_name: "Espada larga del primer hombre de plata" #NT!
 vs_firstman_armingsword_silver_description: "La ornamentada herrería plateada de esta espada bastarda está bellamente grabada. Las inscripciones rúnicas, escritas en la antigua lengua, brillan a la luz de las velas, tan detalladas como el patrón en espiral de la oscura y ondulada hoja de acero valyrio. El estilo y las proporciones de esta espada recuerdan mucho a las espadas que portaban los antiguos héroes de muchas casas del norte que afirmaban descender de los Primeros Hombres." #NT!
 vs_firstman_armingsword_bronze_name: "Espada larga del primer hombre de bronce" #NT!
 vs_firstman_armingsword_bronze_description: "El bronce de esta espada larga ha sido pulido hasta alcanzar un brillo resplandeciente. Las inscripciones rúnicas, escritas en la antigua lengua, brillan a la luz de las velas, tan detalladas como el patrón en espiral de la oscura hoja ondulada de acero valyrio. El estilo y las proporciones de esta espada recuerdan mucho a las espadas que portaban los antiguos héroes de muchas casas del norte que afirmaban descender de los Primeros Hombres." #NT!
 vs_firstman_longsword_gold_name: "Espada bastarda del primer hombre dorada" #NT!
 vs_firstman_longsword_gold_description: "El metal de esta espada bastarda brilla con un brillo dorado. Las inscripciones rúnicas, escritas en la antigua lengua, brillan a la luz de las velas, tan detalladas como el patrón en espiral de la oscura y ondulada hoja de acero valyrio. El estilo y las proporciones de esta espada recuerdan mucho a las espadas que portaban los antiguos héroes de muchas casas del norte que afirmaban descender de los Primeros Hombres." #NT!
 vs_firstman_longsword_silver_name: "Espada bastarda del primer hombre de plata" #NT!
 vs_firstman_longsword_silver_description: "La ornamentada herrería plateada de esta espada bastarda está bellamente grabada. Las inscripciones rúnicas, escritas en la antigua lengua, brillan a la luz de las velas, tan detalladas como el patrón en espiral de la oscura y ondulada hoja de acero valyrio. El estilo y las proporciones de esta espada recuerdan mucho a las espadas que portaban los antiguos héroes de muchas casas del norte que afirmaban descender de los Primeros Hombres." #NT!
 vs_firstman_longsword_bronze_name: "Espada bastarda del primer hombre de bronce" #NT!
 vs_firstman_longsword_bronze_description: "El bronce de esta espada larga ha sido pulido hasta alcanzar un brillo resplandeciente. Las inscripciones rúnicas, escritas en la antigua lengua, brillan a la luz de las velas, tan detalladas como el patrón en espiral de la oscura hoja ondulada de acero valyrio. El estilo y las proporciones de esta espada recuerdan mucho a las espadas que portaban los antiguos héroes de muchas casas del norte que afirmaban descender de los Primeros Hombres." #NT!
 vs_valyrian_armingsword_gold_name: "Espada larga valyria dorada" #NT!
 vs_valyrian_armingsword_gold_description: "El elaborado trabajo de metal de esta espada larga brilla con un brillo dorado. Las escamas del metal texturizado relucen y resplandecen a la luz de las velas, tan detalladas como el patrón en espiral de la hoja de acero valyrio ondulado y oscuro. Esta espada recuerda a las temibles armas que empuñaban los señores dragón de la antigua Valyria." #NT!
 vs_valyrian_armingsword_silver_name: "Espada larga valyria plateada" #NT!
 vs_valyrian_armingsword_silver_description: "La ornamentada metalistería plateada de esta espada larga está bellamente grabada. Las escamas del metal texturizado brillan y relucen a la luz de las velas, tan detalladas como el patrón en espiral de la oscura hoja ondulada de acero valyrio. Esta espada recuerda a las temibles armas que empuñaban los señores dragón de la antigua Valyria." #NT!
 vs_valyrian_longsword_gold_name: "Espada bastarda valyria dorada" #NT!
 vs_valyrian_longsword_gold_description: "El metal de esta espada bastarda brilla con un brillo dorado. La fina filigrana reluce a la luz de las velas, tan detallada como el patrón en espiral de la oscura hoja ondulada de acero valyrio. Esta espada recuerda a las temibles armas que empuñaban los señores dragón de la antigua Valyria." #NT!
 vs_valyrian_longsword_silver_name: "Espada bastarda valyria plateada" #NT!
 vs_valyrian_longsword_silver_description: "La ornamentada metalistería plateada de esta espada bastarda está bellamente grabada. Las escamas del metal texturizado brillan y relucen a la luz de las velas, tan detalladas como el patrón en espiral de la oscura hoja ondulada de acero valyrio. Esta espada recuerda a las temibles armas que empuñaban los señores dragón de la antigua Valyria." #NT!
  
 maekar_mace_name: "Maza de Maekar" #NT!
 maekar_mace_description: "Forjada durante la juventud de Maekar Targaryen, esta enorme maza con púas solo puede ser manejada adecuadamente por los guerreros más poderosos." #NT!
 bobby_hammer_name: "El martillo de guerra de Robert" #NT!
 bobby_hammer_description: "Forjado por el maestro herrero de Storm's End, Donal Noye, este martillo de guerra es de un tamaño y un peso tan inmensos que se necesitaría un hombre con la fuerza de un gigante para manejarlo." #NT!
 bobby_hammer_cooler_description: "Forjado por el maestro herrero de Bastión de Tormentas, Donal Noye, este martillo de guerra es de un tamaño y un peso tan inmensos que haría falta un hombre con la fuerza de un gigante para manejarlo. Robert Baratheon utilizó este martillo para aplastar el pecho del príncipe Rhaegar Targaryen en la Batalla del Tridente." #NT!
 bobby_hammer_duel_description: "[my_weapon.GetDesc] [owner.GetFullName] usó este martillo para aplastar el cofre de [loser.GetFullNamePossessive] en la Batalla de [battle_location.GetNameNoTooltip]." #NT!
 rhaegar_sword_name: "La espada de Rhaegar" #NT!
 rhaegar_sword_description: "La mejor espada jamás forjada en las calles de acero de Desembarco del Rey, obsequiada al príncipe Rhaegar Targaryen cuando se convirtió en príncipe de Rocadragón. Esbelta y elegante, una espada digna de un hombre que algún día podría ser rey." #NT!
 rhaegar_sword_duel_description: "[my_weapon.GetDesc] [owner.GetFullName] usó esta espada para matar a [loser.GetFullName] en la Batalla de [battle_location.GetNameNoTooltip]." #NT!
 kingsguard_sword_name: "[owner.GetFullNamePossessive] Espada" #NT!
 kingsguard_sword_description: "Una espada presentada a [owner.GetFullName] al unirse a la Guardia Real." #NT!
 redbeard_axe_name: "Hacha de Barba Roja" #NT!
 redbeard_axe_description: "Un hacha de bronce elaborada a mano que una vez perteneció a Raymun Barbarroja, el Rey Más Allá del Muro." #NT!
 agot_is_wildling_desc: "Eres gente libre" #NT!
 bloodraven_longbow_name: "Diente de cuervo" #NT!
 bloodraven_longbow_description: "El arco largo de color blanco hueso fabricado para Brynden Rivers, más conocido como "Bloodraven". Este impresionante arco se fabricó a partir de una rama caída del gran arciano que le da nombre a Raventree Hall." #NT!
 weirwood_longbow_name: "Arco largo de Weirwood" #NT!
 weirwood_longbow_description: "Este arco largo, fabricado con madera de arciano, posee el inconfundible color blanco hueso característico de los árboles sagrados de los Dioses Antiguos. Está bien elaborado y nunca se pudrirá." #NT!
 dragonbone_longbow_name: "Arco largo de hueso de dragón" #NT!
 dragonbone_longbow_description: "Arcos como estos son raros y muy buscados. Tan fuerte como el acero, pero más ligero y flexible, el hueso de dragón es un material excelente para arcos que, según se dice, superan incluso a los arcos de corazón dorado de las Islas del Verano." #NT!
  
  #Crown Tooltip 
 agot_is_independent_crown_tooltip_desc: "Sólo un gobernante independiente, su cónyuge o sus herederos pueden llevar esta corona." #NT!
 baelor_crown_tooltip_desc: "Sólo los gobernantes virtuosos pueden llevar esta corona." #NT!
  
  #Targaryen Crowns 
 aegon_i_crown_name: "Corona del Conquistador" #NT!
 aegon_i_crown_description: "La corona de Aegon I, "el Conquistador", el hombre que forjó un reino unido con fuego y sangre. Está forjada en acero valyrio y tiene varios rubíes grandes a su alrededor." #NT!
 aenys_crown_name: "Corona del Primer Hijo" #NT!
 aenys_crown_description: "La corona de Aenys I, esta corona está forjada en oro amarillo con incrustaciones de jade y perlas y las caras de los Siete, una ironía dado el contenido de su reinado." #NT!
 jaehaerys_crown_name: "Corona del Conciliador" #NT!
 jaehaerys_crown_description: "La corona de Jaehaerys I, "el Conciliador", es una sencilla banda de siete piedras preciosas engastadas, cada una de un color diferente: una para cada uno de sus reinos y cada uno de sus dioses." #NT!
 aegon_iii_crown_name: "Corona del Dragonbane" #NT!
 aegon_iii_crown_description: "La corona de Aegon III 'Dragonbane' es una corona sencilla, compuesta por una sencilla banda de oro. Aegon III prefería mantener una corte tranquila y ordenada, algo que la corona ejemplifica." #NT!
 baelors_crown_name: "Corona de los Benditos" #NT!
 baelors_crown_description: "Una corona de flores reales que Baelor I, "el Bendito", usó abandonando el metal de sus antepasados. Un entrelazamiento de flores brillantes y verdes intensos que hablaba de la admiración y devoción de Baelor por los Siete que Son Uno y toda su creación." #NT!
 aegon_iv_crown_name: "Corona de los indignos" #NT!
 aegon_iv_crown_description: "La corona de Aegon IV 'el Indigno' es una gran cosa ostentosa, hecha de oro rojo y diseñada para tener numerosas cabezas de dragón rodeándola." #NT!
 maekars_crown_name: "Corona del Yunque" #NT!
 maekars_crown_description: "La corona de Maekar I es una corona marcial, muy parecida al hombre que la usaba, con puntas de hierro negro atadas con una banda de oro rojo." #NT!
 rhaella_crown_name: "Corona de la Reina Trágica" #NT!
 rhaella_crown_historical_description: "Corona de la reina Rhaella Targaryen, esposa del rey Aerys II. Es un aro de plata y hierro marcado con rubíes rojos y salpicado de docenas de diamantes." #NT!
 rhaella_crown_description: "Corona que lució la reina Rhaella Targaryen. Es un círculo de plata y hierro marcado con rubíes rojos y salpicado de docenas de diamantes." #NT!
 visenya_circlet_name: "Círculo de la Hermana Oscura" #NT!
 visenya_circlet_description: "Un aro de acero valyrio oscuro rodeado de rubíes rojos que lleva la reina Visenya, la mayor de los Tres Dragones. Es un poderoso recordatorio de la Hermana Oscura de Aegon el Dragón." #NT!
 rhaenys_circlet_name: "Círculo de la Reina Amada" #NT!
 rhaenys_circlet_description: "Forjado en acero valyrio oscuro e incrustado con rubíes en forma de diamante, este maravilloso círculo fue creado para la reina Rhaenys Targaryen." #NT!
 rhaenys_circlet_historical_description: "Forjado en acero valyrio oscuro e incrustado con rubíes en forma de diamante, este maravilloso círculo perteneció a la reina Rhaenys Targaryen, la más encantadora de las esposas del rey Aegon el Conquistador." #NT!
 alysannecrown_name: "Corona de la Buena Reina" #NT!
 alysannecrown_description: "La corona de la reina Alysanne Targaryen es una banda fina y sencilla de siete piedras preciosas, cada una de un color diferente." #NT!
 alysannecrown_historical_description: "La corona de la reina Alysanne Targaryen, conocida como "La Buena Reina", que es una variación más fina de la corona de su marido." #NT!
 daenerys_crown_name: "Corona de los nacidos de la tormenta" #NT!
 daenerys_crown_historical_description: "La corona de Daenerys I "Stormborn" fue un regalo de Qarth y tiene un aire oriental. Tiene la forma de un dragón de tres cabezas, cada una de jade, marfil y ónice, espirales de oro y alas de plata." #NT!
 daenerys_crown_description: "La corona de Daenerys I "Stormborn". Tiene la forma de un dragón de tres cabezas, cada una de jade, marfil y ónice, espirales de oro y alas de plata." #NT!
 daemon_stepstone_crown_name: "Corona del Príncipe Pícaro" #NT!
 daemon_stepstone_crown_description: "Una corona de hierro y plata incrustada con rubíes rojos e inspirada vagamente en las coronas del Conquistador y el Conciliador, esta corona fue usada por el Príncipe Rebelde Daemon Targaryen después de su conquista de los Peldaños de Piedra." #NT!
 daemon_queen_stepstone_crown_name: "Corona de la consorte del príncipe rebelde" #NT!
 daemon_queen_stepstone_crown_description: "Un círculo de hierro y plata con incrustaciones de rubíes rojos e inspirado libremente en las coronas del Conquistador y el Conciliador." #NT!
 westerosi_valyrian_crown1_name: "Corona del dragón rojo" #NT!
 westerosi_valyrian_crown1_description: "Una corona dorada cuya forma recuerda las alas coriáceas de los dragones y adornada con tres grandes rubíes." #NT!
 westerosi_valyrian_crown2_name: "Corona de fuego y sangre" #NT!
 westerosi_valyrian_crown2_description: "Una corona de hierro negro cuya forma se asemeja a las alas coriáceas de los dragones y adornada con tres grandes rubíes para representar los colores y el símbolo de la Casa Targaryen." #NT!
  
  #Baratheon Crowns 
 robertI_crown_name: "Corona del Ciervo Coronado" #NT!
 robertI_crown_description: "La Corona de Roberto I Baratheon, esta obra tiene la forma de una cornamenta de ciervo y está realizada en oro." #NT!
 stannis_crown_name: "Corona del ciervo de fuego" #NT!
 stannis_crown_description: "La Corona de Stannis I Baratheon está hecha de oro rojo y moldeada en las Llamas del Señor de la Luz, su nueva religión." #NT!
 renly_crown_name: "Corona del ciervo encabritado" #NT!
 renly_crown_description: "La corona de Renly I Baratheon tiene la forma de la de su boda: una cabeza de ciervo de jade que emerge en el frente, rodeada por un anillo de rosas doradas." #NT!
 joffreyI_crown_name: "Corona del León y el Ciervo" #NT!
 joffreyI_crown_description: "La corona de Joffrey I Baratheon es una pieza dorada de astas, aunque es más indulgente que la de su padre, adornada con rubíes y diamantes negros." #NT!
  
  #Blackfyre crowns 
 daemonblackfyre_crown_name: "Corona del Dragón Negro" #NT!
 daemonblackfyre_crown_historical_description: "La corona de Daemon Fuegoscuro, el llamado "Dragón Negro" y el primero de los llamados Pretendientes Fuegoscuro. Modelada a imagen de la corona del Conquistador, aunque con los colores invertidos, como el propio sigilo Fuegoscuro. Se utilizó vidriagón en lugar de rubíes, encuadernado en cobre rojo." #NT!
 daemonblackfyre_crown_description: "Esta corona fue diseñada a imagen de la corona del Conquistador, aunque con los colores invertidos, como el propio sigilo de Fuegoscuro. Se utilizó vidriagón en lugar de rubíes y estaba engarzada en cobre rojo en lugar de acero valyrio." #NT!
  
  #Kingdom Crowns 
 driftwood_crown_1_name: "Corona de madera flotante" #NT!
 driftwood_crown_1_description: "A diferencia de los reyes de las tierras verdes, las coronas del antiguo Gran Rey eran regalos del mar, hechas de un trozo de madera arrastrada por la orilla, para recordarles que todo lo que tenían les había sido dado por el Dios Ahogado." #NT!
 iron_isles_crown_name: "Corona de los Reyes de Hierro" #NT!
 iron_isles_crown_description: "Cuando la Casa Greyiron puso fin a la Asamblea Real y se declararon los Reyes de Hierro de las Islas, se fabricaron una Corona de Hierro para simbolizar su control." #NT!
 riverlands_crown_name: "Corona del Tridente" #NT!
 riverlands_crown_description: "Una elegante corona adornada con el símbolo de un tridente, que representa el gran río que lleva su nombre. Destinada a ser usada por el gobernante de las Tierras de los Ríos." #NT!
 crown_of_mudd_name: "Corona de ríos y colinas" #NT!
 crown_of_mudd_description: "Una corona de oro adornada con esmeraldas. Esta corona ha sido elaborada a imagen del escudo de armas de la antigua Casa Mudd." #NT!
 crown_of_winter_name: "Corona de invierno" #NT!
 crown_of_winter_description: "La antigua corona de la Casa Stark, primero como Reyes del Invierno y luego como Reyes del Norte. Está hecha de nueve espadas de hierro unidas por un círculo de bronce con runas inscritas y es un símbolo de una tierra dura y de un pueblo más duro." #NT!
 crown_of_jeyne_westerling_name: "Corona de la joven reina" #NT!
 crown_of_jeyne_westerling_description: "Un círculo abierto de bronce martillado con bordes de plata. Similar a la famosa Corona de Invierno que usaban los antiguos Reyes del Invierno Stark, esta corona está rematada por púas forjadas en forma de espadas. Aunque a diferencia de ella, presenta solo seis espadas de plata hechas con la forma de Hielo, la hoja de acero valyrio ancestral de la Casa Stark. Para representar a la familia de su portador, también presenta seis conchas marinas de plata interpuestas entre las hojas." #NT!
 dorne_crown_name: "Corona de sol y lanza" #NT!
 dorne_crown_description: "Una banda circular hecha de oro, rodeada por ocho sellos dorados de la Casa Nymeros Martell, el sol y las lanzas, que en su centro alberga un rubí rojo." #NT!
 falcon_crown_name: "Corona de Montaña y Valle" #NT!
 falcon_crown_description: "Una corona de plata como las que usan los Reyes Arryn de la Montaña y el Valle, esta corona está centrada por las alas de un halcón que emergen de una piedra preciosa azul, mientras que debajo se encuentra una luna plateada con cresta." #NT!
 iron_stag_crown_name: "Corona de las Astas de Hierro" #NT!
 iron_stag_crown_description: "La corona de uno de los Durrandon más marciales refleja esa naturaleza. Aunque la mayoría de los Reyes de la Tormenta eran conocidos por sus actividades marciales, esta corona es para aquellos verdaderamente dedicados al camino de la Espada." #NT!
 stormlands_crown_name: "Corona de tormentas" #NT!
 stormlands_crown_description: "La Corona de la Tormenta era la corona ancestral de la Casa Durrandon, usada desde que Durran se casó con Elenei y se levantó el Séptimo Castillo." #NT!
 westerlands_crown_name: "Círculo de la Roca" #NT!
 westerlands_crown_description: "El Círculo de la Roca era la corona tradicional de la Reina Consorte de la Casa Lannister, y es un hermoso círculo decorado con oro, gemas y leones." #NT!
 westerlands2_crown_name: "Corona de Roca y Colina" #NT!
 westerlands2_crown_description: "La Corona de la Roca fue usada por los Reyes de la Roca de la Casa Lannister, quienes rastrean su descendencia hasta Lann el Inteligente y Loreon el León." #NT!
 crown_of_gardener_peace_name: "Flores de paz" #NT!
 crown_of_gardener_peace_description: "Una corona de vides y flores. El jardinero Los reyes de la antigüedad usaban coronas como estas en tiempos de paz." #NT!
 crown_of_gardener_war_iron_name: "Espinas de guerra" #NT!
 crown_of_gardener_war_iron_description: "Una corona de enredaderas de hierro con espinas prominentes. Los reyes jardineros de la antigüedad usaban coronas como estas en tiempos de guerra." #NT!
  
  #Regional Crowns 
  
 crown_of_first_men_name: "Corona de los primeros hombres" #NT!
 crown_of_first_men_description: "Un sencillo círculo de bronce con runas inscritas de los Primeros Hombres." #NT!
 valeman_crown_name: "Corona de los Valemen" #NT!
 valeman_crown_description: "Una corona de plata con diseños intrincadamente tallados y joyas incrustadas, esta corona está hecha en el estilo típico del Valle." #NT!
 stormlander_crown_name: "Corona de los habitantes de las Tormentas" #NT!
 stormlander_crown_description: "Una orgullosa corona dorada con grandes gemas a lo largo de su circunferencia. Hecha al estilo típico de las Tierras de la Tormenta." #NT!
 westerlander2_crown_name: "Corona de los habitantes del oeste" #NT!
 westerlander2_crown_description: "Una corona dorada adornada con diseños intrincados y piedras preciosas pulidas, esta corona está hecha en el estilo típico de Westerlands." #NT!
 reachman_crown_name: "Corona de los Reachmen" #NT!
 reachman_crown_description: "Una hermosa banda dorada adornada con vides doradas entrelazadas de manera intrincada y adornada con joyas brillantes. En el centro de esta exquisita corona se encuentra una espléndida flor dorada, cuyo centro está adornado con una joya de gran tamaño que le agrega un toque cautivador de elegancia." #NT!
 dornish_crown_name: "Corona de los dornienses" #NT!
 dornish_crown_description: "Una banda circular realizada en oro, rodeada por ocho soles dorados, que en su centro albergan gemas de colores." #NT!
 swann_crown_name: "Corona de los cisnes combatientes" #NT!
 swann_crown_description: "Una corona en blanco y negro que presenta dos cisnes uno frente al otro mientras que en el centro hay muchas pequeñas gemas." #NT!
 beyondthewall_crown_name: "Corona del Pueblo Libre" #NT!
 beyondthewall_crown_description: "Una corona de cuero áspero y púas de obsidiana, hecha para alguien lo suficientemente valiente como para reclamar y poseer las tierras más allá del Muro." #NT!
 blackwood_crown_name: "Corona de cuervos" #NT!
 blackwood_crown_description: "Una corona oscura hecha con la forma del cráneo de un cuervo con ramas que representan el antiguo arciano de Raventree Hall." #NT!
 bolton_crown_name: "Corona de los desollados" #NT!
 bolton_crown_description: "Una corona intimidante con representaciones de hombres desollados a lo largo de ella. Muestra con orgullo la antigua tradición de la Casa Bolton que les dio su escudo de armas: la de desollar a sus enemigos, como hicieron en su día con varios Reyes del Invierno de la antigüedad." #NT!
 cargyll_crown_name: "Corona del huevo de oro" #NT!
 cargyll_crown_description: "Una corona dorada que presenta dos gansos dorados uno frente al otro mientras que en el centro hay dos rubíes rojos y un gran rubí negro." #NT!
 dayne_crown_name: "Corona de la mañana" #NT!
 dayne_crown_description: "Esta corona, realizada al estilo de los antiguos tocados de los Reyes de la Lluvia de Estrellas, está hecha de plata y está centrada por una gran estrella plateada con una estrella con joyas de amatista en su centro." #NT!
 dustin_crown_name: "Corona de los túmulos" #NT!
 dustin_crown_description: "La corona de los antiguos Reyes de Túmulo, supuestamente descendientes del Primer Rey." #NT!
 florent_crown_name: "Corona del Zorro" #NT!
 florent_crown_description: "Una corona de oro centrada en la mirada de ojos rojos rubí de un astuto zorro, con flores de bronce incrustadas con una piedra preciosa azul a su lado." #NT!
 frey_crown_name: "Corona del Cruce" #NT!
 frey_crown_description: "Un facsímil de una corona que se dice fue usada hace miles de años durante la Era de los Cien Reinos por la Casa Frey, esta corona de plata presenta una serie de pequeñas torres en miniatura del Cruce, con tres gemas azules debajo de cada torre." #NT!
 greyjoy_crown_name: "Corona del Kraken" #NT!
 greyjoy_crown_description: "Una corona de hierro y forrada de oro con la forma de un kraken, con sus largos tentáculos rodeando y agarrando la cabeza de quien la usa." #NT!
 harlaw_crown_name: "Corona de la ley dura" #NT!
 harlaw_crown_description: "Una corona grabada con la muerte, esta corona presenta los cráneos gritadores de los muertos, la guadaña del Extraño y una piedra preciosa de color violeta claro." #NT!
 hightower_crown_name: "Corona de la Torre Alta" #NT!
 hightower_crown_description: "Una exquisita corona elaborada en plata y oro presenta nueve réplicas en miniatura de la Torre Hightower de Oldtown, realizadas en plata, cada una adornada con una llama dorada brillante en su cúspide. Estas torres están elegantemente conectadas por llamas doradas talladas adicionales, mientras que la corona en sí está elegantemente incrustada con radiantes joyas de rubí y esmeralda." #NT!
 manderly_crown_name: "Corona del tritón" #NT!
 manderly_crown_description: "Una reproducción fiel de la corona que lució la Casa Manderly, siglos antes de su exilio del Dominio. Esta resplandeciente corona dorada, que evoca la imagen de olas ondulantes y está adornada con perlas brillantes, muestra en su centro una representación meticulosamente elaborada de dos tritones agarrando un tridente. Alrededor de la corona, las joyas de esmeralda están meticulosamente colocadas en medio de motivos de olas intrincadamente tallados, lo que le suma un encanto regio." #NT!
 reach_crown_name: "Corona de la rosa dorada" #NT!
 reach_crown_description: "Una hermosa banda dorada adornada con vides doradas entrelazadas de manera intrincada y adornada con brillantes joyas de esmeralda. En el centro de esta exquisita corona se encuentra una espléndida flor dorada, cuyo corazón está adornado con una joya de esmeralda de gran tamaño que le agrega un toque cautivador de elegancia." #NT!
 redwyne_crown_name: "Corona de vino" #NT!
 redwyne_crown_description: "Una delicada banda dorada adornada con brillantes piedras preciosas azules dispuestas en el elegante diseño de una vid. En el centro hay una hoja de parra invertida, flanqueada por deliciosas joyas de color púrpura elaboradas a semejanza de uvas." #NT!
 reed_crown_name: "Corona de los Crannogs" #NT!
 reed_crown_description: "Una diadema elaborada con la piel de un cocodrilo del Cuello, su vértice está adornado con los formidables dientes de la criatura, mientras que la fachada principal de la diadema está adornada con un trío de ojos de cocodrilo." #NT!
 royce_crown_name: "Corona de Runas" #NT!
 royce_crown_description: "Esta corona de bronce, con piedras preciosas circulares negras y tallados de runas de los Primeros Hombres, está hecha a imagen de la antigua corona real de la Casa Royce del Valle." #NT!
 tarly_crown_name: "Corona de la Caza" #NT!
 tarly_crown_description: "Una cautivadora corona elaborada en oro y plata cuenta con una banda central de oro adornada con brillantes piedras preciosas verdes, acompañada de una serie de puntas de flecha de plata, cada una adornada con un radiante rubí rojo en su centro. En el centro de la corona se encuentra una espléndida representación de un arco de plata, con sus extremos adornados con resplandecientes joyas rojas y verdes. Adornando el espacio entre la flecha que apunta hacia arriba, situada en el centro del arco, hay una delicada esfera de oro adornada con intrincados grabados de hojas y arqueros." #NT!
 tarth_crown_name: "Corona de la Estrella de la Tarde" #NT!
 tarth_crown_description: "Una elegante corona cilíndrica dorada, que se distingue por seis aberturas meticulosamente talladas que se asemejan al sol, complementadas por seis aberturas adicionales meticulosamente talladas que reflejan la forma de la luna." #NT!
 tully_crown_name: "Corona de la Trucha" #NT!
 tully_crown_description: "Una corona de hierro y plata que se distingue por sus torres en forma de aletas de pez. La corona está adornada con un toro de hierro en su base, mientras que encima y debajo de las torres de pez, una disposición de exquisitas piedras preciosas azules y rosas sobre un patrón de piel de pez plateado agrega un toque de opulencia." #NT!
 umber_crown_name: "Corona del último hogar" #NT!
 umber_crown_description: "Una corona de hierro moldeada intrincadamente en la forma de las manos de un hombre encadenado, que simboliza su liberación al liberarse de la esclavitud." #NT!
 crown_of_the_wall_name: "Corona del Muro" #NT!
 crown_of_the_wall_description: "Una corona de cristal y púas de hierro negro rudimentario diseñada para parecerse al Muro y sus diecinueve castillos. El Muro, sede tradicional de la Guardia de la Noche, protege los reinos de los hombres de las amenazas que se ciernen sobre ellos. Cualquier gobernante que reclame directamente el control de esta antigua fortificación verá su reinado difícil y muy difamado." #NT!
 crown_of_westerling_name: "Corona del Peñón" #NT!
 crown_of_westerling_description: "Un círculo abierto con una textura arenosa a lo largo de su longitud y decorado con seis conchas blancas que representan las de la Casa Westerling." #NT!
 crown_of_the_tides_name: "Corona de las Mareas" #NT!
 crown_of_the_tides_description: "Una corona adornada con figuras de caballitos de mar y patrones que recuerdan las profundidades del océano. Ideal para un rey de las mareas." #NT!
 crown_of_true_winter_name: "Corona de hielo" #NT!
 crown_of_true_winter_description: "Un círculo abierto de hierro pulido con incrustaciones de diamantes relucientes, coronado por nueve púas heladas. Una corona como esta se perdió hace mucho tiempo y solo se recuerda en los registros de la Ciudadela y en documentos dispersos por todo el Norte. La forma se parecía claramente a la de las históricas Coronas de Invierno de la Casa Stark, aunque difería lo suficiente en su color, diseño y material como para ser digna de mención. El material de las púas en sí es un tema de debate, ya que pocos de los que registraron sus propiedades pudieron identificar con seguridad si eran diamantes, vidrio u otro cristal. Incluso hay quienes creen que estaban hechas de hielo auténtico, mantenido por la magia antigua de los Hijos del Bosque. Se desconoce quién llevaba esa corona o por qué se hizo. Muchos creen que se hizo en homenaje a la Casa Stark, tal vez usada por una Reina o Princesa de Invernalia. Otros, sin embargo, afirman que se hizo en burla del dominio que los Reyes Stark reclamaban sobre el Invierno. Aún más ridículas son las historias que persisten sobre que se trata de la misma corona hecha para la Reina Cadáver de ojos azules, amante del legendario Rey de la Noche de la Guardia de la Noche, aunque los maestres lo niegan rotundamente y lo consideran un mero rumor." #NT!
 valyrian_crown1_name: "Círculo del Feudo Libre" #NT!
 valyrian_crown1_description: "Un círculo de diseño valyrio en honor a los dioses de la antigua Valyria." #NT!
 valyrian_crown2_name: "Corona del Feudo Libre" #NT!
 valyrian_crown2_description: "Una corona de plata con forma de alas de cuero de dragones y adornada con tres grandes gemas." #NT!
  
  #Religious Crowns 
 crown_of_the_grey_king_rusted_name: "Corona del Rey Gris" #NT!
 crown_of_the_grey_king_rusted_description: "Esta antigua corona se hizo con los dientes de Nagga, el gran dragón marino que mató el Rey Gris. Es el símbolo supremo de autoridad para los Hijos del Hierro, ya que solo ese gran devorador la usó." #NT!
 crown_of_the_nights_king_name: "Corona del Rey de la Noche" #NT!
 crown_of_the_nights_king_description: "Una corona oscura y antigua, hecha para el hombre que la historia recuerda como el Rey de la Noche. Este amenazador tocado está hecho de hierro negro y gélidas púas de hielo afilado que permanecen inalteradas solo por la misma magia que sostiene el Muro." #NT!
 crown_of_the_nights_king_replica_name: "Corona del Rey de la Noche" #NT!
 crown_of_the_nights_king_replica_description: "Una corona oscura, diseñada para parecerse a la que llevaba el hombre recordado por la historia como el Rey de la Noche. Este amenazador tocado está hecho de hierro negro y tiene púas de vidrio hechas para imitar el hielo del Muro." #NT!
 crown_of_the_seven_name: "Corona de la fe" #NT!
 crown_of_the_seven_description: "La Corona de la Fe es un símbolo de los Siete que Son Uno y su adoración. Realizada en oro y decorada con perlas, plata y gemas multicolores, esta corona muestra con orgullo 7 instancias de la estrella de siete puntas a lo largo de su circunferencia." #NT!
 crown_of_the_old_gods_name: "Corona del Pacto" #NT!
 crown_of_the_old_gods_description: "La Corona del Pacto es un símbolo de los Dioses Antiguos y su adoración. Hecha de bronce, el metal de los Primeros Hombres, y adornada con rubíes rojos que reflejan los Arcianos, la corona es un faro para todos los que se adhieren a los Dioses Antiguos." #NT!
 crown_of_rhllor_name: "Corona de llamas" #NT!
 crown_of_rhllor_description: "Una corona de fuego hecha para representar y honrar al Señor de la Luz. Porque la noche es oscura y llena de terrores." #NT!
 circlet_of_rhllor_name: "Círculo de fuego" #NT!
 circlet_of_rhllor_description: "Un círculo de fuego hecho para representar y honrar al Señor de la Luz. Porque la noche es oscura y llena de terrores." #NT!
 crown_of_hugor_name: "Corona de la Unción del Padre" #NT!
 crown_of_hugor_description: "Fabricada a partir de las siete estrellas de Hugor, esta corona es una recreación de la legendaria corona otorgada al primer Rey de los Ándalos por el propio Padre." #NT!
  
  #Other Crowns 
 crown_of_winter_roses_name: "Corona de rosas de invierno" #NT!
 crown_of_winter_roses_description: "Una hermosa corona de rosas azules de invierno." #NT!
  
 shieraseastar_necklace_name: "Collar de estrella de mar de Shiera" #NT!
 shieraseastar_necklace_description: "Un collar propiedad de Shiera Seastar, hija bastarda del rey Aegon IV 'El Indigno' Targaryen, que presenta una abundante cantidad de perlas blancas marinas, así como perlas verdes y azules más grandes." #NT!
  
  #Armours 
 maelys_armour_name: "Plato de lo Monstruoso" #NT!
 maelys_armour_description: "Maelys Blackfyre, el infame pretendiente, es conocido por su monstruosa segunda cabeza, que requiere una armadura especializada para poder usarla." #NT!
 monstrous_desc: "Esta armadura fue hecha para adaptarse a alguien monstruoso." #NT!
 rhaegars_armour_name: "Armadura de Rhaegar" #NT!
 rhaegars_armour_description: "La armadura de Rhaegar Targaryen está hecha de placas de color negro noche, con el dragón de tres cabezas de la Casa Targaryen decorando el peto con rubíes. Debajo de la armadura de placas reposa una cota de malla dorada, y el yelmo de la armadura está decorado elaboradamente con un motivo dracónico." #NT!
 roberts_armour_name: "La armadura de Roberto" #NT!
 roberts_armour_description: "La armadura de Robert Baratheon es sencilla pero formidable. Grandes placas de acero protegen al portador, bajo las cuales se encuentra una cota de malla. Gran parte de la armadura está cubierta por un tabardo que lleva el ciervo negro de la Casa Baratheon. El yelmo de la armadura lleva temibles cuernos de astas, también emblemáticos del sigilo de Baratheon." #NT!
 kingsguard_armour_name: "[owner.GetFullNamePossessive] Armadura de la Guardia Real" #NT!
 kingsguard_armour_description: "Un conjunto de armadura esmaltada en blanco que se le regaló a [owner.GetFullName] al unirse a la Guardia Real." #NT!
 skinchangers_second_pelt_name: "La segunda piel del cambiapieles" #NT!
 skinchangers_second_pelt_description: "Esta piel mal curada fue tomada de una bestia elegida por un cambiapieles para tomar posesión de ella una vez que su propio cuerpo flaqueara." #NT!
 valyrian_steel_armor_name: "Armadura de acero valyrio" #NT!
 valyrian_steel_armor_description: "Un conjunto de escamas de acero valyrio, este conjunto de armadura supera con creces el valor de un reino y es, sin duda, la armadura más protectora disponible." #NT!
  
 lucerys_gun_name: "El arma de Lucerys" #NT!
 lucerys_gun_desc: "Prepárate para morir." #NT!
  
 claimed_dawn_desc: "Por derecho o por fuerza, debes reclamar el Amanecer para ejercerlo." #NT!
 sword_of_the_morning_desc: "Espada de la mañana" #NT!
 artifact_martell_wall_shield_name: "Escudo de Dorne" #NT!
 artifact_martell_wall_shield_description: "Un escudo dorniense estilizado con ornamentadas decoraciones regionales." #NT!
  
 the_white_book_name: "El libro blanco" #NT!
 the_white_book_desc: "Este tomo de cuero blanco, formalmente conocido como El Libro de los Hermanos, registra los hechos y hazañas de cada miembro que ha servido en las ilustres filas de la Guardia Real." #NT!
  
 agot_artifact_saans_scrolls_name: "Antiguos pergaminos valyrios" #NT!
 agot_artifact_saans_scrolls_desc: "Antiguos pergaminos de Valyria que hablan de profecías y dragones." #NT!
  
 #Filler 
 agot_artifact_winter_rose: "Rosa de invierno" #NT!
 agot_artifact_winter_rose_desc: "Una hermosa flor de color azul pálido, del color de las heladas de principios del invierno." #NT!
  
 artifact_dragon_egg: "Huevo de dragón" #NT!
 artifact_dragon_egg_reforged_tt: "Tu huevo ha sido forjado nuevamente en un [court_artifact|E]" #NT!
 dud_egg_desc: "[egg.GetDesc]\n\nEste huevo parece estar petrificado y no muestra signos de eclosión." #NT!
 dragon_egg_gen_desc: "Un huevo de dragón petrificado. El paso del tiempo lo ha convertido en piedra, pero aún brilla con su belleza." #NT!
 dragon_egg_rainbow: "Huevo de dragón arcoiris" #NT!
 dragon_egg_rainbow_desc: "$dragon_egg_gen_desc$ Las escamas iridiscentes de este huevo brillan como metal pulido." #NT!
 dragon_egg_rainbow_desc_living: "Las escamas iridiscentes de este huevo brillan como metal pulido. Fue puesto por [dragon_parent.GetName]." #NT!
 dragon_egg_yellow: "Huevo de dragón amarillo" #NT!
 dragon_egg_yellow_desc: "$dragon_egg_gen_desc$ Adornado con brillantes escamas amarillas que brillan como oro batido en la luz, este huevo es una belleza." #NT!
 dragon_egg_yellow_desc_living: "Este huevo es una belleza, adornado con escamas amarillas relucientes que brillan como oro batido a la luz. Fue puesto por [dragon_parent.GetName]." #NT!
 dragon_egg_blue: "Huevo de dragón azul" #NT!
 dragon_egg_blue_desc: "$dragon_egg_gen_desc$ Con un brillo azul cobalto, este huevo es ciertamente fascinante." #NT!
 dragon_egg_blue_desc_living: "Este huevo, de un azul cobalto brillante, es ciertamente fascinante. Fue puesto por [dragon_parent.GetName]." #NT!
 dragon_egg_purple: "Huevo de dragón morado" #NT!
 dragon_egg_purple_desc: "$dragon_egg_gen_desc$ Las escamas de color púrpura oscuro de esta concha son sueños tejidos a partir de sombras crepusculares y polvo de estrellas." #NT!
 dragon_egg_purple_desc_living: "Las escamas de color morado oscuro de esta concha son sueños tejidos a partir de sombras crepusculares y polvo de estrellas. Fue colocada por [dragon_parent.GetName]." #NT!
 dragon_egg_red: "Huevo de dragón rojo" #NT!
 dragon_egg_red_desc: "$dragon_egg_gen_desc$ Las escamas de color rojo oscuro de este huevo desprenden chispas carmesí como rubíes que brillan a la luz del sol." #NT!
 dragon_egg_red_desc_living: "Las escamas de color rojo oscuro de este huevo desprenden chispas carmesí como si fueran rubíes que brillan a la luz del sol. Fue puesto por [dragon_parent.GetName]." #NT!
 dragon_egg_tan: "Huevo de dragón color canela" #NT!
 dragon_egg_tan_desc: "$dragon_egg_gen_desc$ Remolinos de tonos tostados y cremas evocan imágenes de las arenas de Dorne." #NT!
 dragon_egg_tan_desc_living: "Los remolinos de tonos tostados y cremas evocan imágenes de las arenas de Dorne. Fue creado por [dragon_parent.GetName]." #NT!
 dragon_egg_brown: "Huevo de dragón marrón" #NT!
 dragon_egg_brown_desc: "$dragon_egg_gen_desc$ Las escamas de color marrón oscuro de este huevo emiten destellos dorados y bronceados a la luz." #NT!
 dragon_egg_brown_desc_living: "Las escamas de color marrón oscuro de este huevo emiten destellos dorados y bronceados a la luz. Fue puesto por [dragon_parent.GetName]." #NT!
 dragon_egg_blackDarkRed: "Huevo de dragón de obsidiana" #NT!
 dragon_egg_blackDarkRed_desc: "$dragon_egg_gen_desc$ Las escamas negras de este huevo están onduladas y arremolinadas con un color escarlata intenso." #NT!
 dragon_egg_blackDarkRed_desc_living: "Las escamas negras de este huevo están onduladas y arremolinadas con un color escarlata intenso. Fue puesto por [dragon_parent.GetName]." #NT!
 dragon_egg_iceFire: "Huevo de dragón de hielo y fuego" #NT!
 dragon_egg_iceFire_desc: "$dragon_egg_gen_desc$ Las escamas de este huevo son una sorprendente mezcla de rojos ardientes y azules helados, como si el fuego y el hielo estuvieran atrapados en un conflicto eterno." #NT!
 dragon_egg_iceFire_desc_living: "Las escamas de este huevo son una sorprendente mezcla de rojos ardientes y azules helados, como si el fuego y el hielo estuvieran atrapados en un conflicto eterno. Fue puesto por [dragon_parent.GetName]." #NT!
 dragon_egg_black: "Huevo de dragón negro" #NT!
 dragon_egg_black_desc: "$dragon_egg_gen_desc$ El brillo de obsidiana de este huevo recuerda a las noches más oscuras sin luna." #NT!
 dragon_egg_black_desc_living: "El brillo de obsidiana de este huevo recuerda a las noches más oscuras sin luna. Fue puesto por [dragon_parent.GetName]." #NT!
 dragon_egg_orange: "Huevo de dragón naranja" #NT!
 dragon_egg_orange_desc: "$dragon_egg_gen_desc$ Las escamas de este huevo brillan en tonos del intenso color naranja del atardecer." #NT!
 dragon_egg_orange_desc_living: "Las escamas de este huevo brillan en tonos del intenso color naranja del atardecer. Fue puesto por [dragon_parent.GetName]." #NT!
 dragon_egg_white: "Huevo de dragón blanco" #NT!
 dragon_egg_white_desc: "$dragon_egg_gen_desc$ Las escamas de este huevo son de un blanco perlado." #NT!
 dragon_egg_white_desc_living: "Las escamas de este huevo son de color blanco perlado. Fue puesto por [dragon_parent.GetName]." #NT!
 dragon_egg_pink: "Huevo de dragón rosa" #NT!
 dragon_egg_pink_desc: "$dragon_egg_gen_desc$ Las escamas de color rosa pálido de este huevo brillan suavemente con la luz." #NT!
 dragon_egg_pink_desc_living: "Las escamas de color rosa pálido de este huevo brillan suavemente con la luz. Fue puesto por [dragon_parent.GetName]." #NT!
 dragon_egg_green_1: "Huevo de dragón verde" #NT!
 dragon_egg_green_1_desc: "$dragon_egg_gen_desc$ De un color verde jade, las escamas de este huevo son más que hermosas." #NT!
 dragon_egg_green_1_desc_living: "De un color verde pálido, las escamas de este huevo son más que hermosas. Fue puesto por [dragon_parent.GetName]." #NT!
 dragon_egg_green_2: "Huevo de dragón verde" #NT!
 dragon_egg_green_2_desc: "$dragon_egg_gen_desc$ Un verde jade entremezclado con bronce, las escamas de este huevo son más que hermosas." #NT!
 dragon_egg_green_2_desc_living: "De un verde jade mezclado con bronce, las escamas de este huevo son más que hermosas. Fue puesto por [dragon_parent.GetName]." #NT!
 dragon_egg_grey_1: "Huevo de dragón gris" #NT!
 dragon_egg_grey_1_desc: "$dragon_egg_gen_desc$ El tono ahumado de este huevo coincide con el de la ceniza volcánica." #NT!
 dragon_egg_grey_1_desc_living: "El tono ahumado de este huevo coincide con el de la ceniza volcánica. Fue puesto por [dragon_parent.GetName]." #NT!
 dragon_egg_grey_2: "Huevo de dragón gris" #NT!
 dragon_egg_grey_2_desc: "$dragon_egg_gen_desc$ El tono ahumado de este huevo coincide con el de la ceniza volcánica." #NT!
 dragon_egg_grey_2_desc_living: "El tono ahumado de este huevo coincide con el de la ceniza volcánica. Fue puesto por [dragon_parent.GetName]." #NT!
 dragon_egg_gold: "Huevo de dragón dorado" #NT!
 dragon_egg_gold_desc: "$dragon_egg_gen_desc$ Adornado con encantadoras escamas doradas que brillan en la luz, este huevo es una belleza." #NT!
 dragon_egg_gold_desc_living: "Las escamas doradas de este huevo brillan con la luz. Fue puesto por [dragon_parent.GetName]." #NT!
 dragon_egg_whitegold: "Huevo de dragón beige" #NT!
 dragon_egg_whitegold_desc: "$dragon_egg_gen_desc$ Las escamas blancas de este huevo se complementan con profundas vetas doradas que brillan como rayos del sol." #NT!
 dragon_egg_whitegold_desc_living: "Las escamas blancas de este huevo se complementan con vetas doradas que brillan como rayos de sol. Fue puesto por [dragon_parent.GetName]." #NT!
  
 dragon_egg_purplegold: "Huevo de dragón ametrino" #NT!
 dragon_egg_purplegold_desc: "$dragon_egg_gen_desc$ Los tonos púrpuras reales de este huevo se entrelazan con brillantes vetas doradas, creando una apariencia majestuosa que recuerda a los tapices reales." #NT!
 dragon_egg_purplegold_desc_living: "Los majestuosos tonos púrpura de este huevo se entrelazan con brillantes vetas doradas, creando una apariencia majestuosa que recuerda a los tapices reales. Fue colocado por [dragon_parent.GetName]." #NT!
  
 dragon_egg_flame: "Huevo de dragón de llamas" #NT!
 dragon_egg_flame_desc: "$dragon_egg_gen_desc$ La superficie de este huevo parpadea con tonos ardientes, parecidos a llamas arremolinadas que bailan y lamen el aire con vibrantes tonos naranja, rojo y amarillo." #NT!
 dragon_egg_flame_desc_living: "La superficie de este huevo brilla con tonos ardientes, como llamas que giran y bailan y lamen el aire con vibrantes tonos naranja, rojo y amarillo. Fue creado por [dragon_parent.GetName]." #NT!
  
 dragon_egg_blackred: "Huevo de dragón de piedra de sangre" #NT!
 dragon_egg_blackred_desc: "$dragon_egg_gen_desc$ Este huevo es predominantemente negro, adornado con manchas rojas vívidas y dispersas que brillan como sangre derramada contra el fondo oscuro." #NT!
 dragon_egg_blackred_desc_living: "Este huevo es predominantemente negro, adornado con manchas rojas vívidas y dispersas que brillan como sangre derramada contra el fondo oscuro. Fue puesto por [dragon_parent.GetName]." #NT!
  
 dragon_egg_brownspots: "Huevo de dragón de enstatita" #NT!
 dragon_egg_brownspots_desc: "$dragon_egg_gen_desc$ La superficie de este huevo marrón está adornada con encantadoras manchas marrones, que se asemejan a los patrones naturales que se encuentran en la corteza de los árboles envejecidos." #NT!
 dragon_egg_brownspots_desc_living: "La superficie de este huevo marrón está adornada con encantadoras manchas marrones, que se asemejan a los patrones naturales que se encuentran en la corteza de un árbol viejo. Fue colocado por [dragon_parent.GetName]." #NT!
  
 dragon_egg_redblackgold: "Huevo de dragón de oro carmesí" #NT!
 dragon_egg_redblackgold_desc: "$dragon_egg_gen_desc$ Las escamas de color carmesí intenso de este huevo están bordeadas de oro brillante, mientras que los elegantes detalles negros añaden un toque de misterio y elegancia." #NT!
 dragon_egg_redblackgold_desc_living: "Las escamas de color carmesí intenso de este huevo están bordeadas de oro brillante, mientras que los elegantes detalles negros añaden un toque de misterio y elegancia. Fue creado por [dragon_parent.GetName]." #NT!
  
 dragon_egg_palered: "Huevo de dragón carmesí" #NT!
 dragon_egg_palered_desc: "$dragon_egg_gen_desc$ La superficie de color rojo pálido de este huevo irradia un brillo suave y cálido, que recuerda a un delicado rubor al amanecer." #NT!
 dragon_egg_palered_desc_living: "La superficie roja pálida de este huevo desprende un brillo suave y cálido que recuerda al delicado rubor del amanecer. Fue puesto por [dragon_parent.GetName]." #NT!
  
 dragon_egg_darkblue: "Huevo de dragón índigo" #NT!
 dragon_egg_darkblue_desc: "$dragon_egg_gen_desc$ La superficie azul profundo de este huevo brilla como las profundidades del océano, exudando una sensación de misterio y tranquilidad." #NT!
 dragon_egg_darkblue_desc_living: "La superficie azul profundo de este huevo brilla como las profundidades del océano y transmite una sensación de misterio y tranquilidad. Fue puesto por [dragon_parent.GetName]." #NT!
  
 dragon_egg_darkred: "Huevo de dragón rojo sangre" #NT!
 dragon_egg_darkred_desc: "$dragon_egg_gen_desc$ La superficie de este huevo es de un rojo intenso y profundo, parecido a la sangre recién derramada, con un atractivo oscuro y siniestro." #NT!
 dragon_egg_darkred_desc_living: "La superficie de este huevo es de un rojo intenso y profundo, parecido a la sangre recién derramada, con un encanto oscuro y siniestro. Fue puesto por [dragon_parent.GetName]." #NT!
  
 dragon_egg_frost: "Huevo de dragón de hielo" #NT!
 dragon_egg_frost_desc: "$dragon_egg_gen_desc$ El huevo es una sorprendente mezcla de blanco helado y azul helado, su superficie irradia un frío invernal." #NT!
 dragon_egg_frost_desc_living: "El huevo es una llamativa combinación de blanco helado y azul helado, y su superficie irradia un frío invernal. Fue puesto por [dragon_parent.GetName]." #NT!
  
 dragon_egg_greengrey: "Huevo de dragón esmeralda" #NT!
 dragon_egg_greengrey_desc: "$dragon_egg_gen_desc$ La superficie verde pálido de este huevo está adornada con delicados remolinos grises, creando un patrón sereno y fascinante." #NT!
 dragon_egg_greengrey_desc_living: "La superficie verde pálido de este huevo está adornada con delicados remolinos grises que crean un patrón sereno y fascinante. Fue colocado por [dragon_parent.GetName]." #NT!
  
 dragon_egg_magma: "Huevo de dragón de magma" #NT!
 dragon_egg_magma_desc: "$dragon_egg_gen_desc$ La superficie de este huevo es una mezcla ardiente de rojos y naranjas fundidos, similar al magma burbujeante, que recuerda a la Perdición de Valyria." #NT!
 dragon_egg_magma_desc_living: "La superficie de este huevo es una mezcla ardiente de rojos y naranjas fundidos, similar al magma burbujeante, que recuerda a la Perdición de Valyria. Fue creado por [dragon_parent.GetName]." #NT!
  
 dragon_egg_darkpurple: "Huevo de dragón violeta" #NT!
 dragon_egg_darkpurple_desc: "$dragon_egg_gen_desc$ Los tonos profundos y oscuros del púrpura mantienen el tono de este huevo profundo y capturan la esencia del anochecer." #NT!
 dragon_egg_darkpurple_desc_living: "Los tonos morados profundos y oscuros mantienen el tono intenso de este huevo y capturan la esencia del anochecer. Fue puesto por [dragon_parent.GetName]." #NT!
  
 dragon_egg_palepink: "Huevo de dragón de primavera" #NT!
 dragon_egg_palepink_desc: "$dragon_egg_gen_desc$ Un delicado huevo de color rosa pálido, su color suave y relajante, recuerda el primer rubor del amanecer." #NT!
 dragon_egg_palepink_desc_living: "Un huevo delicado de color rosa pálido, de color suave y relajante, que recuerda al primer rubor del amanecer. Fue puesto por [dragon_parent.GetName]." #NT!
  
 dragon_egg_palebluepink: "Huevo de dragón de ópalo" #NT!
 dragon_egg_palebluepink_desc: "$dragon_egg_gen_desc$ De un suave tono azul pálido, este huevo está adornado con delicadas manchas de color rosa que recuerdan a una suave mañana de primavera." #NT!
 dragon_egg_palebluepink_desc_living: "Este huevo, de un suave tono azul pálido, está adornado con delicadas manchas rosas que recuerdan a una apacible mañana de primavera. Fue puesto por [dragon_parent.GetName]." #NT!
  
 dragon_egg_pinkspot: "Huevo de dragón magenta" #NT!
 dragon_egg_pinkspot_desc: "$dragon_egg_gen_desc$ Este huevo irradia tonos vibrantes de rosa brillante y morado, que se combinan en una sorprendente exhibición de brillantez colorida." #NT!
 dragon_egg_pinkspot_desc_living: "Este huevo irradia vibrantes tonos de rosa y violeta brillantes, que se combinan en una sorprendente exhibición de brillantez colorida. Fue puesto por [dragon_parent.GetName]." #NT!
  
 dragon_egg_rainbowgold: "Huevo de dragón prismático" #NT!
 dragon_egg_rainbowgold_desc: "$dragon_egg_gen_desc$ Este huevo exhibe un espectro de colores más oscuros entremezclados con toques de brillo dorado, creando una exhibición cautivadora e iridiscente." #NT!
 dragon_egg_rainbowgold_desc_living: "Este huevo exhibe un espectro más oscuro de colores del arco iris entremezclados con toques de brillo dorado, creando una exhibición cautivadora e iridiscente. Fue puesto por [dragon_parent.GetName]." #NT!
  
 dragon_egg_sunburst: "Huevo de dragón con rayos de sol" #NT!
 dragon_egg_sunburst_desc: "$dragon_egg_gen_desc$ La superficie de este huevo estalla con tonos vibrantes, que recuerdan a un sol radiante, sus colores se mezclan en una deslumbrante exhibición de calidez y energía." #NT!
 dragon_egg_sunburst_desc_living: "La superficie de este huevo rebosa de tonos vibrantes que recuerdan a un rayo de sol radiante, y sus colores se mezclan en una deslumbrante exhibición de calidez y energía. Fue puesto por [dragon_parent.GetName]." #NT!
  
 dragon_egg_goldpink: "Huevo de dragón tripano" #NT!
 dragon_egg_goldpink_desc: "$dragon_egg_gen_desc$ Este huevo brilla con un tono dorado brillante, delicadamente besado por tonos de rosa suave, exudando un aura de elegancia y calidez." #NT!
 dragon_egg_goldpink_desc_living: "Este huevo brilla con un tono dorado lustroso, delicadamente besado por matices de rosa suave, y exuda un aura de elegancia y calidez. Fue puesto por [dragon_parent.GetName]." #NT!
  
 dragon_egg_bluebronze: "Huevo de dragón de apatita" #NT!
 dragon_egg_bluebronze_desc: "$dragon_egg_gen_desc$ Este huevo presenta una combinación armoniosa de azul profundo y bronce intenso, creando una apariencia majestuosa y sorprendente." #NT!
 dragon_egg_bluebronze_desc_living: "Este huevo presenta una combinación armoniosa de azul profundo y bronce intenso, lo que crea una apariencia majestuosa y llamativa. Fue puesto por [dragon_parent.GetName]." #NT!
  
 dragon_egg_greenorange: "Huevo de dragón de unakita" #NT!
 dragon_egg_greenorange_desc: "$dragon_egg_gen_desc$ Este huevo muestra un vivo contraste de verde intenso y naranja vibrante, evocando una sensación de energía y brillo." #NT!
 dragon_egg_greenorange_desc_living: "Este huevo muestra un contraste vivo de verde intenso y naranja vibrante, lo que evoca una sensación de energía y luminosidad. Fue puesto por [dragon_parent.GetName]." #NT!
  
 dragon_egg_bronze: "Huevo de dragón de bronce" #NT!
 dragon_egg_bronze_desc: "$dragon_egg_gen_desc$ Este huevo es de bronce brillante y su superficie refleja un tono cálido y rico que recuerda al metal envejecido." #NT!
 dragon_egg_bronze_desc_living: "Este huevo es de un bronce brillante y su superficie refleja un tono cálido y rico que recuerda al metal envejecido. Fue colocado por [dragon_parent.GetName]." #NT!
  
 dragon_egg_blackgreen: "Huevo de dragón de fuego salvaje" #NT!
 dragon_egg_blackgreen_desc: "$dragon_egg_gen_desc$ Este huevo está impregnado de siniestros remolinos de negros siniestros y verdes espeluznantes, lo que insinúa locura y peligro en sus profundidades." #NT!
 dragon_egg_blackgreen_desc_living: "Este huevo está impregnado de siniestros remolinos de siniestros tonos negros y verdes espeluznantes, lo que sugiere locura y peligro en sus profundidades. Fue puesto por [dragon_parent.GetName]." #NT!
  
 dragon_egg_greygreenyellow: "Huevo de dragón andalusí" #NT!
 dragon_egg_greygreenyellow_desc: "$dragon_egg_gen_desc$ El patrón de este huevo imita la paleta de la naturaleza, combinando a la perfección verdes terrosos, marrones y tostados en una apariencia armoniosa." #NT!
 dragon_egg_greygreenyellow_desc_living: "El diseño de este huevo imita la paleta de colores de la naturaleza, combinando a la perfección tonos verdes terrosos, marrones y tostados para lograr una apariencia armoniosa. Fue realizado por [dragon_parent.GetName]." #NT!
  
 dragon_egg_blackyellow: "Huevo de dragón serpentino" #NT!
 dragon_egg_blackyellow_desc: "$dragon_egg_gen_desc$ "Este huevo está adornado con llamativos tonos negros y amarillos, creando un contraste audaz y llamativo que recuerda a las abejas volando en medio de un sueño de primavera." #NT!
 dragon_egg_blackyellow_desc_living: "Este huevo está adornado con llamativos tonos negros y amarillos, creando un contraste llamativo y audaz que recuerda a las abejas volando en medio de un sueño de primavera. Fue puesto por [dragon_parent.GetName]." #NT!
  
 dragon_egg_yellowgreen: "Huevo de dragón de peridoto" #NT!
 dragon_egg_yellowgreen_desc: "$dragon_egg_gen_desc$ Este huevo irradia vibrantes tonos amarillos y verdes, capturando la esencia del follaje fresco de primavera y los días soleados y alegres." #NT!
 dragon_egg_yellowgreen_desc_living: "Este huevo irradia vibrantes tonos amarillos y verdes, capturando la esencia del follaje fresco de la primavera y los días soleados y alegres. Fue puesto por [dragon_parent.GetName]." #NT!
  
 dragon_egg_silver: "Huevo de dragón plateado" #NT!
 dragon_egg_silver_desc: "$dragon_egg_gen_desc$ Este brillante huevo plateado tiene una superficie lisa, similar a un espejo, y emana un aura fresca y mística." #NT!
 dragon_egg_silver_desc_living: "Este huevo plateado brillante tiene una superficie lisa como un espejo y emana un aura fría y mística. Fue puesto por [dragon_parent.GetName]." #NT!
  
 artifact_dragon_skull: "Cráneo de dragón" #NT!
 agot_artifact_dragon_skull_name: "[dragon.GetNamePossessiveNoTooltip] Calavera" #NT!
 agot_artifact_dragon_skull_desc: "Este cráneo pertenecía al dragón [newly_created_artifact.GetFeatureText('dragon_skull_size')], [newly_created_artifact.MakeScope.Var('dragon').Char.GetNameNicknamed]. El fuego se convirtió en carne, [newly_created_artifact.MakeScope.Var('dragon').Char.GetSheHe] ahora se convirtió en cenizas y huesos. [newly_created_artifact.Custom('DragonSkullIsSmallSkull')]\n\n[newly_created_artifact.Custom('DragonSkullGetDragonRider')][newly_created_artifact.Custom('DragonSkullGetDragonKiller')]" #NT!
 agot_own_red_keep.tt: "Sólo la Fortaleza Roja puede exhibir este artefacto." #NT!
  
 feature_dragon_skull_size_huge: "masivo" #NT!
 feature_dragon_skull_size_large: "grande" #NT!
 feature_dragon_skull_size_medium: "promedio" #NT!
 feature_dragon_skull_size_small: "pequeño" #NT!
  
 agot_empty: ""
 agot_artifact_dragon_skull_natural: "$agot_empty$" #NT!
 agot_artifact_dragon_skull_slain: "[ROOT.Var('dragon').Char.GetNameNoTooltip] fue asesinado por [ROOT.Var('killer').Char.GetName]." #NT!
 agot_artifact_dragon_skull_past_rider: "En vida, [ROOT.Var('rider').Char.GetName] reclamó a este dragón como el primer jinete de [ROOT.Var('dragon').Char.GetHerHis]." #NT!
 agot_artifact_dragon_skull_famous_past_rider: "[ROOT.Var('dragon').Char.GetNameNoTooltip] fue montado famosamente por [ROOT.Var('famous_rider').Char.GetNameNicknamed]." #NT!
 agot_artifact_dragon_skull_wall_ornament: "Mira fijamente a todos los que pasan bajo sus ojos hundidos, como si de alguna manera todavía estuviera observando." #NT!
  
 artifact_dragon_horn: "Cuerno de dragón" #NT!
 agot_artifact_dragon_horn_desc: "[newly_created_artifact.Custom('DragonHornForgedBy')] Los glifos valyrios que tallan su perversa superficie no dejan lugar a dudas sobre su naturaleza hechicera. Se cree que los señores dragón de la antigua Valyria usaban estos artefactos para someter a los dragones a su voluntad." #NT!
  
 agot_artifact_dragon_horn_old_valyria: "Este cuerno del infierno fue forjado a partir de los restos de un dragón de la antigua Valyria." #NT!
 agot_artifact_dragon_horn_after_doom: "Este cuerno del infierno fue forjado a partir de los restos del dragón [ROOT.Var('dragon').Char.GetName] por [ROOT.Var('creator').Char.GetName]." #NT!
  
 agot_dragonbinder: "Vinculador de dragones" #NT!
 agot_artifact_dragonbinder_desc: "Este cuerno del infierno, que mide más de 1,80 metros de largo, fue forjado a partir de los restos de un enorme dragón de la antigua Valyria. Brilla con un negro intenso y está revestido con oro rojo y acero valyrio. Los glifos valyrios están tallados en la superficie reflectante, aunque distorsionada, de este cuerno. [ROOT.Char.Custom('DragonBinderReadValyrian')]" #NT!
 agot_dragonbinder_read_valyrian: "Los glifos dicen: "Soy el Vinculador de Dragones... Ningún hombre mortal podrá sondearme y vivir... Sangre por fuego, fuego por sangre"." #NT!
  
 agot_must_bind_horn.tt: "Sólo una persona atada al cuerno puede usarlo." #NT!
  
 uller_skull: "Calavera con ojos de amatista" #NT!
 uller_skull_desc: "La Casa Uller conserva un objeto extraño en su castillo: una calavera, sin adornos y sencilla, a excepción de las dos amatistas que se encuentran en las cuencas de sus ojos. Cuando se les presiona, los Uller simplemente sonríen y dicen que es una antigua reliquia." #NT!
 hands_hand: "Mano de la mano" #NT!
 hands_hand_desc: "El Amante de las Viudas era famoso por su crueldad y cuando finalmente llegó el rescate de Orys Baratheon, tomó la mano de espada de cada cautivo, incluida la de la propia Mano del Rey, Orys Baratheon." #NT!
 smugglers_fingers: "Los dedos del contrabandista de cebollas" #NT!
 smugglers_fingers_desc: "Los dedos del contrabandista de cebollas" #NT!
 aemond_eye: "Ojo del Matar Hermanos" #NT!
 aemond_eye_desc: "Este zafiro, supuestamente el ojo de Aemond Kinslayer, fue encontrado arrastrado a las orillas del Ojo de Dios." #NT!
 fox_wedding_cloak: "La capa nupcial del zorro" #NT!
 fox_wedding_cloak_desc: "Según la leyenda, Florys la zorra tomó tres maridos, vistiendo una capa diferente en cada matrimonio; se dice que este es uno solo." #NT!
 stars_of_hugor: "“Estrella” de Hugor" #NT!
 stars_of_hugor_desc: "Una de las siete estrellas legendarias arrancadas del cielo para la corona de Hugor de la Colina por el propio Padre." #NT!
 harp_of_the_bard: "Arpa del bardo" #NT!
 harp_of_the_bard_desc: "Se dice que esta vieja arpa deteriorada perteneció a un bardo que robó una rosa azul." #NT!
 symeon_left_eye: "El ojo izquierdo de Simeón" #NT!
 symeon_right_eye: "El ojo derecho de Simeón" #NT!
 symeon_eye_desc: "Uno de los zafiros estelares utilizados por el legendario caballero Simeón Ojos de Estrella." #NT!
 oily_black_stone: "Pedazo de piedra negra aceitosa" #NT!
 oily_black_stone_desc: "Pedazo de piedra negra aceitosa" #NT!
 giants_tooth: "Diente de gigante" #NT!
 giants_tooth_desc: "Un diente que se parece a una muela humana en todo excepto por su gigantesco tamaño." #NT!
 forgotten_magnars_drinking_horn: "El cuerno para beber de Magnar olvidado" #NT!
 forgotten_magnars_drinking_horn_desc: "Este cuerno para beber, espléndidamente ornamentado, perteneció a un antiguo líder de los Primeros Hombres. Pocos, si es que alguien, podrían comenzar a especular sobre quién era." #NT!
 eggs_boot: "La bota del huevo" #NT!
 eggs_boot_desc: "Este anillo de sello fue un regalo del padre de Aegon V para su trabajo como escudero de Ser Duncan el Alto, un caballero errante." #NT!
 harmund_tongue: "La lengua de Harmund" #NT!
 harmund_tongue_desc: "Dentro de una caja ricamente tallada y ornamentada, que lleva el sello de los Lannister, hay una lengua seca y preservada. Se dice que la caja fue robada durante una incursión en las Tierras del Oeste, y la naturaleza de la caja le da veracidad, pero se dice que la lengua que está dentro pertenece a Harmund III, cuya lengua fue robada por el Alcaudón por sus blasfemias y mentiras." #NT!
 rhaegar_ruby: "Río rubí" #NT!
 rhaegar_ruby_desc: "Cuando Robert Baratheon asestó el golpe fatal a Rhaegar Targaryen, los rubíes de su coraza se esparcieron por el agua. Algunos de ellos todavía aparecen ocasionalmente en las orillas del Tridente." #NT!
 bran_set_square: "Las escuadras de Brandon" #NT!
 bran_set_square_desc: "Según la leyenda, estas escuadras fueron utilizadas por el primer Brandon Stark, más conocido como Bran el Constructor, quien se dice que construyó la primera Hightower, Bastión de Tormentas, el Muro e Invernalia." #NT!
 dragon_blood_and_bones_potion: "Elixir de la especie de dragón" #NT!
 dragon_blood_and_bones_potion_desc: "Un elixir turbio elaborado con la sangre y los huesos recién extraídos de [dragon.GetName]. Si bien sus efectos no están del todo claros, se sabe que quienes lo han consumido han tenido... experiencias extrañas que atribuyen a este elixir." #NT!
  
 bittersteel_skull: "Cráneo de acero amargo" #NT!
 bittersteel_skull_desc: "Cráneo de Acero Amargo, primer Capitán General de la Compañía Dorada." #NT!
 maelys_skull: "Cráneo de Maelys el Monstruoso" #NT!
 maelys_skull_desc: "Cráneo de Maelys I Fuegoscuro, último pretendiente de Fuegoscuro y capitán general de la Compañía Dorada. Un cráneo grotesco más grande de lo normal, con un cráneo más pequeño del tamaño de un puño igualmente deforme." #NT!
 daemon_blackfyre_skull: "Cráneo de Daemon Fuegoscuro" #NT!
 daemon_blackfyre_skull_desc: "Cráneo de Daemon Blackfyre, Capitán General de la Compañía Dorada que fue asesinado por su primo, Maelys I Blackfyre." #NT!
  
 agot_artifact_moons_rod_name: "Gallo de la luna" #NT!
 agot_artifact_moons_rod_desc: "El septón Luna era famoso por su virilidad divina. Por eso, después de que su fallida insurrección acabara con su vida, sus devotos seguidores le cortaron el pene, lo encurtieron y lo conservaron para que las futuras generaciones de doncellas estériles pudieran florecer con la bendición del Gallo de la Luna." #NT!
  
 iron_throne: "Trono de hierro" #NT!
 iron_throne_desc: "El Trono de Hierro de los Siete Reinos de Poniente fue forjado por orden del rey Aegon I a partir de las espadas de sus enemigos. Es el mayor símbolo del reino y de su gobernante unido." #NT!
 iron_throne_valid: "Esto solo se puede utilizar en el tribunal de [GetTitleByKey('c_kings_landing').GetNameNoTier]" #NT!
 gilded_throne: "Trono dorado" #NT!
 gilded_throne_desc: "Este imponente trono es un elemento permanente de la Galería Dorada. El gran león, tallado en la propia Roca y bañado en oro de las minas que se encuentran debajo, vigila los numerosos tesoros y honores que se guardan en el interior de la galería." #NT!
 gilded_throne_valid: "Esto solo se puede utilizar en el tribunal de [GetTitleByKey('c_casterly_rock').GetNameNoTier]" #NT!
 seastone_chair: "Silla Seastone" #NT!
 seastone_chair_desc: "El misterioso trono de las Islas del Hierro, la Silla de Piedra Marina, está hecho de piedra negra aceitosa, y su construcción e historia se perdieron hace mucho tiempo en los anales del tiempo." #NT!
 seastone_chair_valid: "Esto solo se puede utilizar en el tribunal de [GetTitleByKey('c_pyke').GetNameNoTier]" #NT!
 ruined_oakenseat: "tocón de roble" #NT!
 ruined_oakenseat_desc: "El trono antaño vivo de la Casa Gardener, que se dice fue plantado por el mismísimo Garth el Verde. Este legendario trono fue incendiado hace mucho tiempo y ahora es un vestigio muerto de glorias pasadas." #NT!
 restored_oakenseat: "Asiento de roble" #NT!
 restored_oakenseat_desc: "Un homenaje al antiguo roble que una vez sirvió como trono a los reyes Jardineros de antaño, un nuevo trono tallado en un árbol vivo ahora se erige como testimonio de la grandeza y el cuidado paciente de las dinastías de Altojardín." #NT!
 oakenseat_valid: "Esto solo se puede utilizar en el tribunal de [GetTitleByKey('c_highgarden').GetNameNoTier]" #NT!
  
 painted_table: "La mesa pintada" #NT!
 painted_table_desc: "Una gran mesa de madera maciza barnizada (negra y carbonizada para representar mares, ríos y lagos) ha sido tallada con la forma de Poniente y sus Siete Reinos. Fabricada por orden de Aegon "el Conquistador", este coloso de quince metros muestra montañas, castillos y asentamientos, etiquetas con incrustaciones de oro, pero sin fronteras. Todo es uno. Un solo reino, para que lo gobierne un solo rey." #NT!
 painted_table_valid: "Esto solo se puede utilizar en el tribunal de [GetTitleByKey('c_dragonstone').GetNameNoTier]" #NT!
  
 high_seat_of_winter_name: "Alto Asiento del Invierno" #NT!
 high_seat_of_winter_desc: "Un asiento alto y austero de piedra pulida, decorado con dos lobos huargos gruñendo y relieves intrincados que rinden homenaje a los arcianos que son considerados sagrados por quienes siguen a los Dioses Antiguos. Este asiento ha servido durante incontables generaciones como trono de los Reyes del Invierno de la Casa Stark." #NT!
 high_seat_of_winter_valid: "Esto solo se puede utilizar en el tribunal de [GetTitleByKey('c_winterfell').GetNameNoTier]" #NT!
  
 seahorse_statue: "Estatua de caballito de mar" #NT!
 seahorse_statue_desc: "Un impresionante caballito de mar de jade, que data de épocas anteriores a la Perdición de Valyria, cuando los señores dragón solían comerciar con mercaderes de las tierras del lejano oriente." #NT!
  
 artifact_dragon_doll: "Muñeca dragón" #NT!
 #dragon_doll_01: "Muñeca dragón sencilla" #NT!
 #dragon_doll_01_desc: "Una muñeca de lana sencilla hecha con la forma de un dragón, aceptable para cualquier niño de una casa de jinetes de dragones." #NT!
  
 dragon_doll_02: "Muñeca dragón exquisita" #NT!
 dragon_doll_02_desc: "Una muñeca de lana multicolor y bellamente hecha con forma de dragón, perfecta para cualquier niño de una casa de jinetes de dragones." #NT!
  
 dragon_doll_03: "Muñeca dragón de alas plateadas" #NT!
 dragon_doll_03_desc: "Una muñeca de lana perfectamente elaborada con la apariencia de Silverwing por la Reina Alysanne Targaryen para regalársela a sus hijas." #NT!
  
 dragon_doll_04: "Muñeca dragón Vermithor" #NT!
 dragon_doll_04_desc: "Una muñeca de lana perfectamente elaborada con la apariencia de Vermithor por la reina Alysanne Targaryen para regalársela a sus hijos." #NT!
  
 dragon_doll_05: "Muñeca dragón azul helado" #NT!
 dragon_doll_05_desc: "Un muñeco dragón de lana azul hielo, imperfecto pero no por ello menos encantador, tejido por Lyanna Stark para su hijo aún no nacido. Sus puntadas irregulares y su forma ligeramente torpe aún transmiten la profundidad del amor y el esfuerzo de Lyanna, a pesar de sus evidentes dificultades con la costura." #NT!
  
 viserra_mirror: "Espejo valyrio" #NT!
 viserra_mirror_desc: "Un espejo antiguo de la Antigua Valyria, elaborado con maestría en acero y adornado con rubíes. El marco está adornado con un intrincado diseño dracónico que refleja el poder y el arte del Feudo Libre de Valyria." #NT!
 artifact_mirror: "Espejo" #NT!
  
 gold_mirror: "Espejo dorado" #NT!
 gold_mirror_desc: "Un espejo bellamente elaborado en oro." #NT!
  
 silver_mirror: "Espejo de plata" #NT!
 silver_mirror_desc: "Un espejo bellamente elaborado en plata." #NT!
  
 artifact_horn: "Bocina" #NT!
 horn_of_herrock_name: "Cuerno de Herrock" #NT!
 horn_of_herrock_desc: "Un gran cuerno negro, retorcido y con bandas de oro. La leyenda dice que [GetScriptedCharacterByHistoryID('KenningK_4').GetFirstNameNicknamed] lo hizo sonar fuera de los muros de [GetTitleByKey('c_kayce').GetNameNoTier] como señal para que las putas de la ciudad abrieran una puerta trasera, lo que le permitiría a él y a sus hombres tomar la ciudad para la Casa [GetDynastyByID('dynn_Lannister').GetName]." #NT!
 horn_of_herrock_valid: "Debe ser miembro de la Cámara [GetDynastyHouseByID('house_KenningK').GetName] y tener el condado de [GetTitleByKey('c_kayce').GetNameNoTier] como su [realm_capital|E]" #NT!
  
  #Maester Artifacts 
 artifact_maester_link: "Eslabón de cadena" #NT!
 artifact_maester_link_collection: "Colección Maester Link" #NT!
 artifact_maester_chain: "Cadena del maestre" #NT!
  
 agot_artifact_link_name: "[owner.Custom('GetLinkType')] Enlace" #NT!
 agot_artifact_link_desc: "[owner.GetShortUIName|U] obtuvo este enlace estudiando bajo [maester.Custom('MaesterCheck')] [maester.GetName] [owner.Custom('GetLinkArtifactDescription')]" #NT!
 agot_artifact_link_desc_no_maester: "[owner.GetShortUIName|U] obtuvo este enlace [owner.Custom('GetLinkArtifactDescription')]" #NT!
 agot_artifact_link_desc_black_iron: "mediante el dominio del cuervo." #NT!
 agot_artifact_link_desc_brass: "por memorizar un número incontable de linajes." #NT!
 agot_artifact_link_desc_bronze: "estudiando las estrellas." #NT!
 agot_artifact_link_desc_copper: "Aprendiendo las historias del mundo." #NT!
 agot_artifact_link_desc_electrum: "enigmáticamente." #NT!
 agot_artifact_link_desc_yellow_gold: "descociendo los libros." #NT!
 agot_artifact_link_desc_red_gold: "en los puntos más finos de las matemáticas." #NT!
 agot_artifact_link_desc_iron: "demostrando una mente para la guerra." #NT!
 agot_artifact_link_desc_lead: "demostrando su conocimiento más fino de los venenos." #NT!
 agot_artifact_link_desc_pewter: "construyendo sus bases en la arquitectura." #NT!
 agot_artifact_link_desc_platinum: "sembrando su propio éxito en los campos de trigo." #NT!
 agot_artifact_link_desc_silver: "aprendiendo a tratar y cuidar a otros con medicamentos." #NT!
 agot_artifact_link_desc_steel: "forjando su propia cadena en una fragua rugiente." #NT!
 agot_artifact_link_desc_tin: "mediante el estudio de la lingüística del mundo." #NT!
 agot_artifact_link_desc_bismuth: "profundizando su comprensión de las religiones." #NT!
 agot_artifact_link_desc_cast_iron: "aprendiendo a cuidar a los animales." #NT!
 agot_artifact_link_desc_antimony: "mediante el estudio de la geografía del mundo natural." #NT!
