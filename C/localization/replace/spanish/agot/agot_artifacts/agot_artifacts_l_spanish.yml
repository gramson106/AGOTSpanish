 artifact_glass_candle: "Vela de cristal" #NT!
 agot_artifact_glass_candle_desc: "Una vela de obsidiana, de color [newly_created_artifact.GetFeatureText('glass_candle_color')], alta y retorcida, y afilada al tacto. Se dice que estas velas arden eternamente, lo que permite a sus dueños mirar a través de los océanos y las montañas. [newly_created_artifact.Custom('GetCandleMagic')]" #NT!
 agot_glass_candle_lit_desc: "Esta vela brilla incómodamente brillante, distorsionando los colores a su alrededor." #NT!
 agot_glass_candle_unlit_desc: "Los acólitos de la Ciudadela permanecen en guardia ante tres de estas velas la noche de su ascenso en un vano intento de encenderlas." #NT!
 agot_glass_candle_lit.tt: "La magia en el mundo es fuerte y la vela de cristal está encendida." #NT!
  
