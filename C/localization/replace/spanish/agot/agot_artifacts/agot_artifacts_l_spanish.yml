 agot_artifact_myrish_lace_name: "Encaje de Myrish" #NT!
 agot_artifact_myrish_lace_desc: "El encaje Myrish es famoso en todo el mundo y es deseado tanto por hombres como por mujeres." #NT!
 agot_artifact_norvoshi_bear_carving_name: "Talla del oso de Norvoshi" #NT!
 agot_artifact_norvoshi_bear_carving_desc: "En las colinas de Norvos siempre se han visto osos, incluso antes de que existiera Norvos, por lo que no es de extrañar que el animal se haya convertido en un símbolo para la gente de la región." #NT!
 agot_artifact_pentoshi_cheese_name: "Queso Pentoshi" #NT!
 agot_artifact_pentoshi_cheese_desc: "Aunque no es tan famoso como el Encaje de Myr, los yelmos de Tyrosh o los tintes de Braavos, el queso de Pentos es un gran producto y la base de la riqueza de más de un Magister Pentoshi." #NT!
 agot_artifact_dothraki_bow_name: "Arco Dothraki" #NT!
 agot_artifact_dothraki_bow_desc: "Los arcos Dothraki son una de sus armas más temibles. Si bien no son tan emblemáticos como los Arakh, sus arcos pueden disparar más que la mayoría de los arcos de Poniente y son lo suficientemente pequeños como para dispararlos a caballo." #NT!
 traditional_house_artifact_modifier_desc: "Este artefacto tradicionalmente pertenece a mi casa o dinastía: $VALUE|=+0$" #NT!
 weirwood_flute_name: "Flauta de arciano" #NT!
 weirwood_flute_desc: "El sonido que produce esta sencilla flauta de arciano es sencillamente encantador. El instrumento es sorprendentemente fácil de tocar, incluso un principiante no se quedará sin dedos para tocar la siguiente nota." #NT!
 is_a_poet_tt: "Eres un poeta" #NT!
 brewing_herbs_name: "Hierbas para preparar cerveza" #NT!
 brewing_herbs_desc: "Esta bolsa contiene hojas y raíces secas, algunas ampliamente conocidas por sus propiedades medicinales y calmantes, otras más difíciles de reconocer." #NT!
  
  #Decisions 
 create_crown_of_hugor_decision: "Forjad la Corona de la Unción del Padre" #NT!
 create_crown_of_hugor_decision_desc: "En tiempos pasados, Hugor de la Colina fue coronado por el Padre Celestial con siete estrellas que él mismo arrancó de los cielos. Luego le ordenó a Hugor que llevara al pueblo elegido de los dioses al atardecer para encontrar las tierras que les habían sido asignadas, Poniente. Desde entonces, las siete estrellas de Hugor se han dividido y se han perdido en el tiempo, pero ahora que están reunidas puedo recrear la corona que ungió a Hugor." #NT!
 I_POSSESS_ALL_STARS: "Posees las siete estrellas de Hugor" #NT!
 I_POSSESS_ALL_STARS_NOT: "Te faltan algunas de las siete estrellas y debes encontrar las restantes." #NT!
 create_crown_of_hugor_decision_tooltip: "Esto utilizará los siete artefactos de las Estrellas de Hugor para crear la Corona de la Unción del Padre." #NT!
 create_crown_of_hugor_decision_confirm: "¡Soy el heredero de Hugor!" #NT!
  
